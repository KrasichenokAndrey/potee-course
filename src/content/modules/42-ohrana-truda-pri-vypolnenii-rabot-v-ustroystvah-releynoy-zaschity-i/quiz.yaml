    explanation: "Пункт 42.8 разрешает это оперативному персоналу соответствующих организаций по утвержденному перечню работ."
    source: "Пункт 42.8"
  - type: single
    text: "Каким составом выполняются работы по пункту 42.8?"
    options:
      - "Бригадой из двух работников с группами III и IV в присутствии представителя потребителя"
