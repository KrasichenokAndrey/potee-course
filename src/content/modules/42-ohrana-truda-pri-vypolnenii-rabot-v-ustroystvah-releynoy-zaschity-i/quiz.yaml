title: "Проверка по разделу XLII"
moduleSlug: "42-ohrana-truda-pri-vypolnenii-rabot-v-ustroystvah-releynoy-zaschity-i"
draft: false
questions:
  - type: single
    text: "Что должны иметь вторичные цепи измерительных трансформаторов тока и напряжения для безопасности работ?"
    options:
      - "Постоянные заземления"
      - "Только временные ограждения"
      - "Только предупредительные плакаты"
      - "Разомкнутые цепи без заземления"
    answer: 1
    explanation: "Пункт 42.1 требует постоянные заземления вторичных цепей измерительных трансформаторов."
    source: "Пункт 42.1"
  - type: single
    text: "Как допускается заземлять группу электрически соединенных вторичных обмоток измерительных трансформаторов в сложных схемах РЗА?"
    options:
      - "Только в одной точке"
      - "В каждой точке без исключения"
      - "Не заземлять"
      - "Только через переносной светильник"
    answer: 1
    explanation: "Пункт 42.1 допускает для такой группы заземление только в одной точке."
    source: "Пункт 42.1"
  - type: single
    text: "По каким документам выполняются работы в схемах устройств сложных защит?"
    options:
      - "По программам, в которых указаны меры безопасности"
      - "Только по устному указанию"
      - "Без программ"
      - "Только по журналу осмотров"
    answer: 1
    explanation: "Пункт 42.1 требует выполнять все работы в схемах сложных защит по программам с указанием мер безопасности."
    source: "Пункт 42.1"
  - type: single
    text: "Что нужно сделать перед разрывом токовой цепи измерительных приборов, РЗА или электроавтоматики?"
    options:
      - "Предварительно закоротить цепь вторичной обмотки трансформатора тока"
      - "Оставить вторичную цепь разомкнутой"
      - "Подать напряжение от постороннего источника"
      - "Снять постоянное заземление"
    answer: 1
    explanation: "Пункт 42.2 требует предварительно закорачивать цепь вторичной обмотки трансформатора тока."
    source: "Пункт 42.2"
  - type: single
    text: "Где закорачивают цепь вторичной обмотки трансформатора тока при необходимости разрыва токовой цепи?"
    options:
      - "На специально предназначенных зажимах или с помощью испытательных блоков"
      - "На любом случайном винте"
      - "Только на корпусе шкафа"
      - "На заземляющем проводнике без зажимов"
    answer: 1
    explanation: "Пункт 42.2 требует использовать специально предназначенные зажимы или испытательные блоки."
    source: "Пункт 42.2"
  - type: single
    text: "Какие работы не допускаются во вторичной цепи между трансформатором тока и установленной закороткой?"
    options:
      - "Работы, которые могут привести к размыканию цепи"
      - "Проверка наличия закоротки"
      - "Осмотр без нарушения цепи"
      - "Работы вне этой цепи"
    answer: 1
    explanation: "Пункт 42.2 запрещает работы, способные привести к размыканию цепи между ТТ и закороткой."
    source: "Пункт 42.2"
  - type: single
    text: "Что должно быть исключено при подаче напряжения от постороннего источника во вторичные устройства и цепи трансформаторов напряжения?"
    options:
      - "Возможность обратной трансформации"
      - "Наличие постоянного заземления"
      - "Использование испытательных блоков"
      - "Оформление работы"
    answer: 1
    explanation: "Пункт 42.3 требует принять меры, исключающие обратную трансформацию."
    source: "Пункт 42.3"
  - type: single
    text: "По какому пункту Правил выполняются проверка и опробование устройств РЗА и электроавтоматики, включая отключение или включение коммутационных аппаратов?"
    options:
      - "По пункту 7.11 Правил"
      - "По пункту 38.40 Правил"
      - "По пункту 35.11 Правил"
      - "По пункту 41.57 Правил"
    answer: 1
    explanation: "Пункт 42.4 отсылает такие проверки и опробования к пункту 7.11 Правил."
    source: "Пункт 42.4"
  - type: single
    text: "Кому разрешается совмещать обязанности допускающего при работах с РЗА, средствами измерений, приборами учета и вторичными цепями?"
    options:
      - "Производителю работ с группой IV из числа персонала, обслуживающего эти устройства"
      - "Любому члену бригады с группой II"
      - "Только неэлектротехническому персоналу"
      - "Любому представителю потребителя"
    answer: 1
    explanation: "Пункт 42.5 разрешает совмещение производителю работ с группой IV из обслуживающего персонала."
    source: "Пункт 42.5"
  - type: single
    text: "Когда допускается совмещение обязанностей допускающего производителем работ по пункту 42.5?"
    options:
      - "Если для подготовки рабочего места не требуется отключений, заземления и временных ограждений в части электроустановки выше 1000 В"
      - "При любой подготовке рабочего места выше 1000 В"
      - "Только если работа выполняется без документов"
      - "Только при полном отсутствии вторичных цепей"
    answer: 1
    explanation: "Пункт 42.5 разрешает совмещение при отсутствии необходимости выполнять эти меры в части электроустановки выше 1000 В."
    source: "Пункт 42.5"
  - type: single
    text: "Кто может работать отдельно от других членов бригады во вторичных цепях и устройствах РЗА и электроавтоматики?"
    options:
      - "Производитель работ с группой IV единолично и члены бригады с группой III на условиях пункта 6.13"
      - "Любой работник с группой I"
      - "Только неэлектротехнический персонал"
      - "Только работники без допуска"
    answer: 1
    explanation: "Пункт 42.6 разрешает такую работу производителю с группой IV и членам бригады с группой III при соблюдении условий."
    source: "Пункт 42.6"
  - type: single
    text: "При каком расположении вторичных цепей и устройств допускается работа отдельно от других членов бригады?"
    options:
      - "В РУ и помещениях, где части выше 1000 В отсутствуют, полностью ограждены или расположены на высоте, не требующей ограждения"
      - "Только рядом с открытыми частями выше 1000 В"
      - "Только на ВЛ"
      - "Только в кабельных колодцах"
    answer: 1
    explanation: "Пункт 42.6 устанавливает именно такие условия расположения токоведущих частей выше 1000 В."
    source: "Пункт 42.6"
  - type: single
    text: "На каких правах работники энергоснабжающих и энергосбытовых организаций работают с приборами учета потребителя, имеющего оперативный персонал?"
    options:
      - "На правах командированного персонала"
      - "На правах персонала потребителя"
      - "Без оформления"
      - "Только как наблюдатели"
    answer: 1
    explanation: "Пункт 42.7 определяет их как командированный персонал."
    source: "Пункт 42.7"
  - type: single
    text: "Какой минимальный состав бригады требуется для работ энергоснабжающих и энергосбытовых организаций с приборами учета у потребителя с оперативным персоналом?"
    options:
