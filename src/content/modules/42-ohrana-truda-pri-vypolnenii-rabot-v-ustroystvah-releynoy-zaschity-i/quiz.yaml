    explanation: "Пункт 42.10 разрешает такую работу единолично персоналу с группой III по утвержденному перечню текущей эксплуатации."
    source: "Пункт 42.10"
  - type: single
    text: "Когда работу с однофазным электросчетчиком в деревянных домах и помещениях без повышенной опасности разрешается выполнять без снятия напряжения?"
