title: "Проверка по разделу XLIII"
moduleSlug: "43-ohrana-truda-pri-vypolnenii-rabot-v-elektricheskoy-chasti-ustroystv"
draft: false
questions:
  - type: single
    text: "Какие требования необходимо соблюдать при обслуживании электрической части устройств ТАИ, защит и технических средств АСУ?"
    options:
      - "Меры электробезопасности, предусмотренные Правилами"
      - "Только требования технологической инструкции цеха"
      - "Только указания производителя оборудования"
      - "Только правила работы с измерительными приборами"
    answer: 1
    explanation: "Пункт 43.1 устанавливает, что обслуживание электрической части устройств ТАИ, защит и технических средств АСУ выполняется с соблюдением мер электробезопасности, предусмотренных Правилами."
    source: "Пункт 43.1"

  - type: single
    text: "Кто вправе выполнять операции с коммутационной аппаратурой на пультах, распределительных щитах и сборках устройств ТАИ без дополнительных условий по наряду?"
    options:
      - "Оперативный персонал"
      - "Любой член ремонтной бригады"
      - "Работник с группой II"
      - "Представитель подрядной организации без допуска"
    answer: 1
    explanation: "Пункт 43.2 прямо указывает оперативный персонал как работников, имеющих право выполнять такие операции."
    source: "Пункт 43.2"

  - type: single
    text: "Где должно быть подтверждено разрешение производителю работ выполнять операции с коммутационной аппаратурой устройств ТАИ по наряду-допуску?"
    options:
      - "В строке «Отдельные указания» наряда-допуска"
      - "В устном распоряжении допускающего"
      - "В личной карточке проверки знаний"
      - "Только в оперативной схеме"
    answer: 1
    explanation: "Пункт 43.2 требует подтверждать такое разрешение записью в строке «Отдельные указания» наряда-допуска."
    source: "Пункт 43.2"

  - type: single
    text: "Как фиксируется разрешение на операции с коммутационной аппаратурой устройств ТАИ, если работа выполняется по распоряжению?"
    options:
      - "Записью в графе 7 журнала учета работ по нарядам-допускам и распоряжениям"
      - "Записью только в сменном журнале технологического цеха"
      - "Отметкой на корпусе коммутационного аппарата"
      - "Отдельным актом после окончания работы"
    answer: 1
    explanation: "Пункт 43.2 предусматривает запись в графе 7 журнала учета работ по нарядам-допускам и распоряжениям."
    source: "Пункт 43.2"

  - type: single
    text: "Кто должен проводить подготовку участка технологического оборудования перед допуском к работам на устройствах ТАИ?"
    options:
      - "Оперативный персонал цеха или участка, в управлении которого находится технологическое оборудование"
      - "Производитель работ независимо от принадлежности оборудования"
      - "Любой член бригады с группой III"
      - "Только административно-технический персонал организации"
    answer: 1
    explanation: "Пункт 43.3 возлагает подготовку участка технологического оборудования на оперативный персонал соответствующего цеха или участка."
    source: "Пункт 43.3"

  - type: single
    text: "С чьего разрешения выполняются опробование и проверка под напряжением элементов схемы или узлов устройств ТАИ во время ремонта и наладки?"
    options:
      - "Начальника смены или оперативного персонала технологического цеха, участка"
      - "Любого работника из состава бригады"
      - "Только представителя службы охраны труда"
      - "Только производителя оборудования"
    answer: 1
    explanation: "Пункт 43.4 требует разрешения начальника смены или оперативного персонала технологического цеха, участка."
    source: "Пункт 43.4"

  - type: single
    text: "Какое условие обязательно перед опробованием устройств ТАИ под напряжением во время ремонта или наладки?"
    options:
      - "Работа должна быть прекращена, а бригада удалена от опробуемого энергооборудования"
      - "Бригада должна оставаться у оборудования для наблюдения"
      - "Необходимо только предупредить производителя работ"
      - "Достаточно снизить нагрузку оборудования"
    answer: 1
    explanation: "Пункт 43.4 указывает, что перед опробованием работа прекращается, бригада удаляется, а защитные заземления, ограждения и плакаты снимаются."
    source: "Пункт 43.4"

  - type: single
    text: "Что должно быть сделано с защитными заземлениями, ограждениями и плакатами перед пробным включением отдельных элементов устройств ТАИ?"
    options:
      - "Они должны быть сняты"
      - "Они должны быть усилены дополнительными плакатами"
      - "Их оставляют без изменений"
      - "Их заменяют сигнальной лентой"
    answer: 1
    explanation: "Пункт 43.4 относит снятие защитных заземлений, ограждений и плакатов к условиям опробования и пробного включения."
    source: "Пункт 43.4"

  - type: single
    text: "Можно ли при неоднократном включении и отключении электрооборудования в процессе опробования не оформлять каждый раз перерыв в наряде-допуске?"
    options:
      - "Можно, если каждый раз выполняются необходимые технические мероприятия"
      - "Нельзя, перерыв оформляется перед каждым включением"
      - "Можно без каких-либо дополнительных мер"
      - "Можно только при работе единолично"
    answer: 1
    explanation: "Пункт 43.4 разрешает такие работы без оформления перерывов в наряде-допуске, но каждый раз с выполнением необходимых технических мероприятий."
    source: "Пункт 43.4"

  - type: single
    text: "Какие работы в устройствах ТАИ допускается выполнять по распоряжению?"
    options:
      - "Работы, не требующие изменения технологической схемы или режима работы оборудования"
      - "Любые работы при наличии производителя работ с группой III"
      - "Работы, требующие изменения технологического режима"
      - "Только работы с полным отключением всего цеха"
    answer: 1
    explanation: "Пункт 43.5 разрешает выполнять по распоряжению работы в устройствах ТАИ, не требующие изменения технологической схемы или режима работы оборудования."
    source: "Пункт 43.5"

  - type: single
    text: "Какая группа по электробезопасности нужна работнику для единоличного выполнения перечисленных работ в устройствах ТАИ по распоряжению?"
    options:
      - "III"
      - "II"
      - "IV"
      - "V"
    answer: 1
    explanation: "Пункт 43.5 допускает единоличное выполнение перечисленных работ работником, имеющим группу III по электробезопасности."
    source: "Пункт 43.5"

  - type: single
    text: "Какая из перечисленных работ может выполняться единолично по распоряжению работником с группой III в устройствах ТАИ?"
    options:
      - "Наладка регистрационной части приборов"
      - "Изменение технологической схемы оборудования"
      - "Работа на токоведущих частях выше 1000 В"
      - "Оперативное переключение без записи"
    answer: 1
    explanation: "Пункт 43.5 включает наладку регистрационной части приборов в перечень работ, допускаемых единолично по распоряжению."
    source: "Пункт 43.5"

  - type: single
    text: "Какие манометры исключены из работ по замене, выполняемых единолично по распоряжению в устройствах ТАИ?"
    options:
      - "Электроконтактные манометры"
      - "Обычные показывающие манометры"
      - "Дифманометры"
      - "Манометры без электрических контактов"
    answer: 1
    explanation: "Пункт 43.5 разрешает замену манометров, кроме электроконтактных, а также дифманометров, термопар и термометров сопротивления."
    source: "Пункт 43.5"

  - type: single
    text: "Где, согласно перечню, можно единолично устранять дефекты в приборах теплотехнического контроля?"
    options:
      - "На блочных и групповых щитах управления"
      - "В силовых ячейках распределительного устройства"
      - "На воздушной линии электропередачи"
      - "В кабельной траншее без допуска"
    answer: 1
    explanation: "Пункт 43.5 называет устранение дефектов в приборах теплотехнического контроля на блочных и групповых щитах управления."
    source: "Пункт 43.5"

  - type: single
    text: "Какая работа с температурными измерениями прямо разрешена единолично по распоряжению в устройствах ТАИ?"
    options:
      - "Профилактика переключателей точек температурных измерений"
      - "Изменение уставок защит без оформления"
      - "Замена силовых кабелей питания"
      - "Опробование схемы под напряжением без разрешения начальника смены"
    answer: 1
    explanation: "Пункт 43.5 включает профилактику переключателей точек температурных измерений в перечень единоличных работ по распоряжению."
    source: "Пункт 43.5"

  - type: single
    text: "Какая работа с техническими средствами АСУ указана среди допустимых единоличных работ по распоряжению?"
    options:
      - "Ремонт комплекса технических средств вычислительной техники АСУ"
      - "Переподключение силовых цепей оборудования"
      - "Изменение технологического режима блока"
      - "Работа в цепях трансформаторов тока с разрывом цепи"
    answer: 1
    explanation: "Пункт 43.5 относит ремонт комплекса технических средств вычислительной техники АСУ к работам, которые может выполнять один работник с группой III по распоряжению."
    source: "Пункт 43.5"

  - type: single
    text: "Какая работа с электронными блоками авторегуляторов может выполняться единолично по распоряжению?"
    options:
      - "Наладка и проверка параметров настройки электронных блоков"
      - "Снятие напряжения с питающей секции без допуска"
      - "Изменение технологической схемы агрегата"
      - "Включение оборудования без выполнения технических мероприятий"
    answer: 1
    explanation: "Пункт 43.5 включает наладку и проверку параметров настройки электронных блоков авторегуляторов в перечень разрешенных работ."
    source: "Пункт 43.5"

  - type: single
    text: "Какие работы с маркировкой устройств ТАИ может выполнять один работник с группой III по распоряжению?"
    options:
      - "Выполнение надписей и маркировки стендов, датчиков, исполнительных механизмов и панелей"
      - "Смена оперативных обозначений без согласования"
      - "Снятие маркировки с действующих цепей без записи"
      - "Переименование оборудования в оперативной схеме"
    answer: 1
    explanation: "Пункт 43.5 разрешает выполнение надписей и маркировки стендов, датчиков, исполнительных механизмов и панелей."
    source: "Пункт 43.5"

  - type: single
    text: "Допускается ли единолично по распоряжению выполнять обдувку щитов и панелей устройств ТАИ сжатым воздухом?"
    options:
      - "Да, если работник имеет группу III"
      - "Нет, такая работа всегда выполняется только по наряду"
      - "Да, но только работником с группой V"
      - "Да, без учета группы по электробезопасности"
    answer: 1
    explanation: "Пункт 43.5 включает обдувку щитов и панелей сжатым воздухом в перечень работ, выполняемых единолично работником с группой III по распоряжению."
    source: "Пункт 43.5"

  - type: single
    text: "Чье разрешение требуется для работ в устройствах ТАИ, расположенных в различных цехах или участках?"
    options:
      - "Начальника смены или оперативного персонала того цеха или участка, где предстоит работать"
      - "Только начальника своего подразделения"
      - "Любого оперативного работника соседнего цеха"
      - "Разрешение не требуется, если работа по распоряжению"
    answer: 1
    explanation: "Пункт 43.6 требует разрешения начальника смены или оперативного персонала цеха либо участка, в котором предстоит работать."
    source: "Пункт 43.6"

  - type: single
    text: "Какие требования должны соблюдаться при работах на сборках задвижек, приводах задвижек и регуляторов?"
    options:
      - "Требования глав IV и XXVII Правил"
      - "Только требования главы XLIII"
      - "Только инструкции завода-изготовителя"
      - "Только требования по работам на кабельных линиях"
    answer: 1
    explanation: "Пункт 43.7 отсылает при таких работах к требованиям глав IV и XXVII Правил."
    source: "Пункт 43.7"

  - type: single
    text: "Кто является допускающим к работам по наряду-допуску или распоряжению в устройствах ТАИ?"
    options:
      - "Оперативный персонал цеха или участка технологического объекта с группой III"
      - "Любой электротехнический работник с группой II"
      - "Производитель работ без учета группы"
      - "Представитель подрядчика без допуска"
    answer: 1
    explanation: "Пункт 43.8 устанавливает, что допускающим является оперативный персонал цеха или участка технологического объекта, имеющий группу III."
    source: "Пункт 43.8"

  - type: single
    text: "Кому разрешается совмещать обязанности допускающего и определять меры безопасности в электрической части устройств ТАИ?"
    options:
      - "Производителю работ с группой IV из числа электротехнического персонала"
      - "Любому члену бригады с группой III"
      - "Наблюдающему без права оперативных действий"
      - "Работнику с группой II при наличии устного разрешения"
    answer: 1
    explanation: "Пункт 43.8 разрешает такое совмещение производителю работ с группой IV из числа электротехнического персонала."
    source: "Пункт 43.8"

  - type: single
    text: "Где фиксируется право производителя работ с группой IV совмещать обязанности допускающего в устройствах ТАИ?"
    options:
      - "В строке «Отдельные указания» наряда-допуска"
      - "Только в журнале инструктажей"
      - "В паспорте прибора"
      - "В устном сообщении начальнику смены"
    answer: 1
    explanation: "Пункт 43.8 требует запись в строке «Отдельные указания» наряда-допуска при таком совмещении."
    source: "Пункт 43.8"
