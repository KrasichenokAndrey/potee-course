title: "Проверка по разделу IX"
moduleSlug: "09-ohrana-truda-pri-vydache-razresheniy-na-podgotovku-rabochego-mesta-i"
draft: false
questions:
  - type: single
    text: "Когда могут проводиться подготовка рабочего места и допуск бригады к работе?"
    options:
      - "Только после получения разрешения от работника, имеющего право выдачи разрешения на подготовку рабочего места и допуск"
      - "До получения разрешения, если бригада уже готова"
      - "По решению любого члена бригады"
      - "После начала работ"
    answer: 1
    explanation: "Пункт 9.1 устанавливает, что подготовка рабочего места и допуск бригады возможны только после получения разрешения от работника, имеющего соответствующее право."
    source: "Пункт 9.1"
  - type: single
    text: "Кто должен выдать разрешение, после которого возможны подготовка рабочего места и допуск?"
    options:
      - "Работник, имеющий право на выдачу разрешения на подготовку рабочего места и допуск к работам"
      - "Любой член бригады"
      - "Только работник, получивший инструктаж, независимо от прав"
      - "Любой представитель подрядной организации"
    answer: 1
    explanation: "Пункт 9.1 связывает подготовку рабочего места и допуск с разрешением именно от работника, имеющего право выдачи такого разрешения."
    source: "Пункт 9.1"
  - type: single
    text: "Какими способами может передаваться разрешение на подготовку рабочего места и допуск к работе?"
    options:
      - "Лично, по телефону, радио, с нарочным или через оперативный персонал промежуточной подстанции"
      - "Только лично"
      - "Только через бумажное письмо почтой"
      - "Только после полного окончания работ"
    answer: 1
    explanation: "Пункт 9.2 перечисляет допустимые способы передачи разрешения: лично, по телефону, радио, с нарочным или через оперативный персонал промежуточной подстанции."
    source: "Пункт 9.2"
  - type: single
    text: "Кому передается разрешение на подготовку рабочего места и допуск к работе?"
    options:
      - "Работнику, выполняющему подготовку рабочего места и допуск бригады к работе"
      - "Любому работнику организации без связи с допуском"
      - "Только членам бригады по отдельности"
      - "Только руководителю кадровой службы"
    answer: 1
    explanation: "Пункт 9.2 указывает, что разрешение передается работнику, который выполняет подготовку рабочего места и допуск бригады."
    source: "Пункт 9.2"
  - type: single
    text: "Допускается ли выдавать разрешение на допуск к работе до прибытия бригады на место работ?"
    options:
      - "Нет, такая выдача не допускается"
      - "Да, всегда допускается заранее"
      - "Да, если работа выполняется по распоряжению"
      - "Да, если бригада прибудет в течение дня"
    answer: 1
    explanation: "Пункт 9.2 прямо запрещает выдачу разрешений на допуск к работе до прибытия бригады на место работ."
    source: "Пункт 9.2"
  - type: single
    text: "По скольким нарядам-допускам или распоряжениям разрешается допуск бригады к работе?"
    options:
      - "Только по одному наряду-допуску или распоряжению"
      - "Одновременно по двум нарядам"
      - "По любому количеству распоряжений"
      - "Без наряда или распоряжения"
    answer: 1
    explanation: "Пункт 9.3 устанавливает, что допуск бригады к работе разрешается только по одному наряду-допуску или распоряжению."
    source: "Пункт 9.3"
