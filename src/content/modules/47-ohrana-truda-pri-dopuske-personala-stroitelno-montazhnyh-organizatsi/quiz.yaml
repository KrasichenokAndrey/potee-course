title: "Проверка по разделу XLVII"
moduleSlug: "47-ohrana-truda-pri-dopuske-personala-stroitelno-montazhnyh-organizatsi"
draft: false
questions:
  - type: single
    text: "На основании какого документа должны выполняться строительно-монтажные, ремонтные и наладочные работы на территории организации - владельца электроустановок?"
    options:
      - "На основании договора или иного письменного соглашения со СМО"
      - "Только на основании устной договоренности"
      - "На основании заявки без указания содержания работ"
      - "Без письменного оформления, если работы кратковременные"
    answer: 1
    explanation: "Пункт 47.1 требует выполнять такие работы в соответствии с договором или иным письменным соглашением со строительно-монтажной, ремонтной или наладочной организацией."
    source: "Пункт 47.1"

  - type: single
    text: "Какие сведения о работах должны быть указаны в договоре или письменном соглашении со СМО?"
    options:
      - "Только стоимость работ"
      - "Содержание, объем и сроки выполнения работ"
      - "Только состав бригады"
      - "Только перечень машин и механизмов"
    answer: 2
    explanation: "Пункт 47.1 требует указывать в соглашении сведения о содержании, объеме и сроках выполнения работ."
    source: "Пункт 47.1"

  - type: single
    text: "Что СМО должна представить перед началом работ на территории владельца электроустановок?"
    options:
      - "Список работников, имеющих право выдачи нарядов-допусков и быть руководителями работ"
      - "Только список транспортных средств"
      - "Только график питания работников"
      - "Только копии паспортов всех сотрудников"
    answer: 1
    explanation: "Пункт 47.1 требует представить список работников, имеющих право выдачи нарядов-допусков и быть руководителями работ."
    source: "Пункт 47.1"

  - type: single
    text: "Какие данные работников указываются в списке, который СМО представляет перед началом работ?"
    options:
      - "Фамилия и инициалы, должность, а также группа по электробезопасности при ее наличии"
      - "Только фамилия без должности"
      - "Только табельный номер"
      - "Только стаж работы в организации"
    answer: 1
    explanation: "Пункт 47.1 требует указать фамилию и инициалы, должность, а также группу по электробезопасности при ее наличии."
    source: "Пункт 47.1"

  - type: single
    text: "Какой документ должен быть составлен перед началом работ СМО на территории действующего предприятия?"
    options:
      - "Акт-допуск на производство работ"
      - "Только сменный рапорт"
      - "Только паспорт рабочего места"
      - "Только акт списания материалов"
    answer: 1
    explanation: "Пункт 47.2 требует перед началом работ составить акт-допуск на производство работ на территории действующего предприятия."
    source: "Пункт 47.2"

  - type: single
    text: "Кто совместно составляет акт-допуск перед началом работ СМО?"
    options:
      - "Руководитель или уполномоченный представитель владельца электроустановок совместно с представителем СМО"
      - "Только руководитель работ СМО"
      - "Только водитель строительной техники"
      - "Любой член бригады СМО"
    answer: 1
    explanation: "Пункт 47.2 указывает, что акт-допуск составляют руководитель или уполномоченный представитель организации-владельца совместно с представителем СМО."
    source: "Пункт 47.2"

  - type: single
    text: "Какие места должны быть определены актом-допуском для отделения выделенного участка СМО от действующей электроустановки?"
    options:
      - "Места создания видимых разрывов электрической схемы"
      - "Только места хранения инструмента"
      - "Только места стоянки личного транспорта"
      - "Места отдыха персонала"
    answer: 1
    explanation: "Пункт 47.3 требует определить места создания видимых разрывов электрической схемы для отделения выделенного участка от действующей электроустановки."
    source: "Пункт 47.3"

  - type: single
    text: "Что акт-допуск должен определить по защитному заземлению?"
    options:
      - "Места установки защитного заземления"
      - "Только тип кабеля заземления"
      - "Фамилию изготовителя заземления"
      - "Цвет заземляющих проводников"
    answer: 1
    explanation: "Пункт 47.3 включает места установки защитного заземления в обязательные сведения акта-допуска."
    source: "Пункт 47.3"

  - type: single
    text: "Какое назначение должны иметь ограждения, определенные актом-допуском?"
    options:
      - "Исключать возможность ошибочного проникновения работников СМО за пределы зоны работ"
      - "Только обозначать место складирования материалов"
      - "Только отделять транспорт от пешеходов"
      - "Только улучшать внешний вид площадки"
    answer: 1
    explanation: "Пункт 47.3 требует определить место и вид ограждений, исключающих ошибочное проникновение работников СМО за пределы зоны работ."
    source: "Пункт 47.3"

  - type: single
    text: "Какие пути должны быть определены актом-допуском?"
    options:
      - "Места входа, выхода, въезда и выезда в зону работ"
      - "Только маршрут до столовой"
      - "Только пути эвакуации из административного здания"
      - "Только подъезд к складу СМО"
    answer: 1
    explanation: "Пункт 47.3 требует определить место входа и выхода, а также въезда и выезда в зону работ."
    source: "Пункт 47.3"

  - type: single
    text: "Должен ли акт-допуск учитывать опасные и вредные факторы на выделенном участке?"
    options:
      - "Да, наличие опасных и вредных факторов должно быть определено"
      - "Нет, это относится только к наряду СМО"
      - "Нет, если участок огражден"
      - "Только при работах выше 1000 В"
    answer: 1
    explanation: "Пункт 47.3 указывает наличие опасных и вредных факторов среди сведений, определяемых актом-допуском."
    source: "Пункт 47.3"

  - type: single
    text: "Где указываются работники, имеющие право допуска работников СМО и право подписи наряда-допуска?"
    options:
      - "В акте-допуске или отдельном распоряжении владельца электроустановок"
      - "Только в путевом листе"
      - "Только в паспорте электроустановки"
      - "Только в журнале выдачи ключей"
    answer: 1
    explanation: "Пункт 47.3 требует указывать таких работников в акте-допуске или отдельном распоряжении организации-владельца."
    source: "Пункт 47.3"

  - type: single
    text: "Кому выдается один экземпляр отдельного распоряжения владельца электроустановок о работниках, имеющих право допуска и подписи наряда-допуска?"
    options:
      - "Представителю СМО"
      - "Только водителю механизма"
      - "Каждому члену бригады"
      - "Только службе охраны объекта"
    answer: 1
    explanation: "Пункт 47.3 устанавливает, что один экземпляр распоряжения выдается представителю СМО."
    source: "Пункт 47.3"

  - type: single
    text: "Кто отвечает за соблюдение мероприятий безопасности, предусмотренных актом-допуском?"
    options:
      - "Руководители СМО и организации - владельца электроустановок"
      - "Только наблюдающий"
      - "Только работник, выдавший наряд"
      - "Только каждый исполнитель лично"
    answer: 1
    explanation: "Пункт 47.4 возлагает ответственность на руководителей СМО и организации - владельца электроустановок."
    source: "Пункт 47.4"

  - type: single
    text: "Какие инструктажи должен пройти персонал СМО по прибытии на место проведения работ?"
    options:
      - "Вводный и первичный инструктаж по безопасности труда"
      - "Только инструктаж по пожарной безопасности"
      - "Только инструктаж по проезду транспорта"
      - "Только повторную проверку знаний"
    answer: 1
    explanation: "Пункт 47.5 требует вводный и первичный инструктаж по безопасности труда."
    source: "Пункт 47.5"

  - type: single
    text: "Что должно учитываться при вводном и первичном инструктаже персонала СМО?"
    options:
      - "Местные особенности и опасные факторы на выделенном участке"
      - "Только должности работников СМО"
      - "Только график работы охраны"
      - "Только перечень строительных материалов"
    answer: 1
    explanation: "Пункт 47.5 требует проводить инструктаж с учетом местных особенностей и опасных факторов на выделенном участке."
    source: "Пункт 47.5"

  - type: single
    text: "Какой дополнительный инструктаж проходят работники СМО, имеющие право выдачи нарядов-допусков и быть руководителями работ?"
    options:
      - "Инструктаж по схемам электроустановок"
      - "Инструктаж только по складскому учету"
      - "Инструктаж по оформлению командировок"
      - "Инструктаж по ремонту строительной техники"
    answer: 1
    explanation: "Пункт 47.5 требует для таких работников дополнительный инструктаж по схемам электроустановок."
    source: "Пункт 47.5"

  - type: single
    text: "Кто должен проводить инструктаж персонала СМО по пункту 47.5?"
    options:
      - "Руководитель или уполномоченный им работник подразделения организации - владельца электроустановок"
      - "Любой работник СМО"
      - "Только представитель подрядной охраны"
      - "Только водитель строительной машины"
    answer: 1
    explanation: "Пункт 47.5 требует, чтобы инструктаж проводил руководитель или уполномоченный им работник подразделения владельца электроустановок."
    source: "Пункт 47.5"

  - type: single
    text: "Где фиксируется проведение инструктажа персонала СМО?"
    options:
      - "В журналах регистрации инструктажей СМО и подразделения владельца электроустановок"
      - "Только в одном журнале СМО"
      - "Только в наряде-допуске"
      - "Только в акте списания материалов"
    answer: 1
    explanation: "Пункт 47.5 требует фиксировать инструктажи в журналах регистрации инструктажей СМО и подразделения организации-владельца."
    source: "Пункт 47.5"

  - type: single
    text: "По какому документу должны проводиться строительно-монтажные, ремонтные и наладочные работы на территории организации?"
    options:
      - "По наряду-допуску, выдаваемому ответственными работниками СМО"
      - "Только по устному распоряжению владельца"
      - "По любому внутреннему бланку бригады"
      - "Без наряда при наличии акта-допуска"
    answer: 1
    explanation: "Пункт 47.6 требует проводить такие работы по наряду-допуску, выдаваемому ответственными работниками СМО."
    source: "Пункт 47.6"

  - type: single
    text: "С учетом каких требований выдается наряд-допуск СМО на строительно-монтажные, ремонтные и наладочные работы?"
    options:
      - "С учетом нормативных правовых актов, устанавливающих требования охраны труда в строительстве"
      - "Только с учетом правил дорожного движения"
      - "Только по паспорту электроустановки"
      - "По произвольной форме без нормативных требований"
    answer: 1
    explanation: "Пункт 47.6 связывает оформление наряда-допуска с требованиями нормативных правовых актов по охране труда в строительстве."
    source: "Пункт 47.6"

  - type: single
    text: "Кто выполняет подготовку рабочего места для строительно-монтажных работ?"
    options:
      - "Работники организации - владельца электроустановок по заявке СМО"
      - "Только работники СМО"
      - "Любой подрядчик без заявки"
      - "Только представитель проектной организации"
    answer: 1
    explanation: "Пункт 47.7 устанавливает, что подготовка рабочего места выполняется работниками владельца электроустановок по заявке СМО."
    source: "Пункт 47.7"

  - type: single
    text: "Какой должна быть зона работ, выделенная для СМО?"
    options:
      - "Огражденной так, чтобы препятствовать ошибочному проникновению персонала СМО в действующую часть электроустановки"
      - "Открытой для свободного прохода"
      - "Обозначенной только устно"
      - "Без ограждения при наличии акта-допуска"
    answer: 1
    explanation: "Пункт 47.8 требует ограждение зоны работ, препятствующее ошибочному проникновению в действующую часть электроустановки."
    source: "Пункт 47.8"

  - type: single
    text: "Как должны быть организованы пути прохода и проезда персонала, машин и механизмов СМО в выделенную огражденную зону?"
    options:
      - "Они не должны пересекать территорию или помещения действующей части электроустановок"
      - "Они должны проходить через действующее РУ для кратчайшего пути"
      - "Их можно выбирать каждый день заново без согласования"
      - "Они не имеют значения, если зона работ ограждена"
    answer: 1
    explanation: "Пункт 47.9 запрещает пересечение путями прохода и проезда территории или помещений действующей части электроустановок."
    source: "Пункт 47.9"

  - type: single
    text: "Кто проводит первичный допуск к работам СМО на территории организации?"
    options:
      - "Допускающий из числа персонала организации - владельца электроустановок"
      - "Руководитель работ СМО без участия владельца"
      - "Любой член бригады СМО"
      - "Представитель охраны предприятия"
    answer: 1
    explanation: "Пункт 47.10 требует, чтобы первичный допуск проводил допускающий из числа персонала владельца электроустановок."
    source: "Пункт 47.10"

  - type: single
    text: "Где расписывается допускающий при первичном допуске СМО к работам?"
    options:
      - "В наряде-допуске, выданном ответственным работником СМО"
      - "Только в своем оперативном журнале"
      - "В журнале учета ключей"
      - "В путевом листе строительной техники"
    answer: 1
    explanation: "Пункт 47.10 требует подпись допускающего в наряде-допуске, выданном работником СМО, ответственным за выдачу наряда-допуска."
    source: "Пункт 47.10"

  - type: single
    text: "Кто разрешает приступить к работе после подписи допускающего в наряде-допуске СМО?"
    options:
      - "Руководитель работ СМО"
      - "Только допускающий владельца"
      - "Любой исполнитель"
      - "Только представитель службы охраны труда"
    answer: 1
    explanation: "Пункт 47.10 указывает, что после подписи допускающего руководитель работ СМО разрешает приступить к работе."
    source: "Пункт 47.10"

  - type: single
    text: "Кто выполняет ежедневный допуск персонала СМО, если зона работ не выгорожена?"
    options:
      - "Допускающий"
      - "Любой представитель СМО"
      - "Только водитель строительной машины"
      - "Работник, ответственный за склад"
    answer: 1
    explanation: "Пункт 47.11 требует ежедневный допуск допускающим, если зона работ не выгорожена."
    source: "Пункт 47.11"

  - type: single
    text: "Что требуется, если путь следования работников СМО в выделенную зону проходит по территории или через помещения действующего РУ?"
    options:
      - "Ежедневный допуск допускающим и работа под надзором наблюдающего от владельца электроустановок"
      - "Проход без сопровождения при наличии пропуска"
      - "Только устное предупреждение работников"
      - "Работа без наблюдающего, если есть наряд СМО"
    answer: 1
    explanation: "Пункт 47.11 требует в таком случае ежедневный допуск допускающим и проведение работ под надзором наблюдающего из персонала владельца электроустановок."
    source: "Пункт 47.11"

  - type: single
    text: "Кто назначается наблюдающим за работами СМО в случаях, предусмотренных пунктом 47.11?"
    options:
      - "Работник из числа персонала организации - владельца электроустановок"
      - "Любой работник СМО"
      - "Только водитель механизма"
      - "Любой посетитель объекта"
    answer: 1
    explanation: "Пункт 47.11 предусматривает наблюдающего из числа персонала организации - владельца электроустановок."
    source: "Пункт 47.11"

  - type: single
    text: "За что наблюдающий отвечает наравне с ответственным руководителем или исполнителем СМО?"
    options:
      - "За соответствие подготовленного рабочего места указаниям наряда-допуска"
      - "Только за сроки выполнения строительных работ"
      - "Только за качество монтажа оборудования"
      - "Только за учет материалов СМО"
    answer: 1
    explanation: "Пункт 47.12 устанавливает ответственность наблюдающего за соответствие подготовленного рабочего места указаниям наряда-допуска."
    source: "Пункт 47.12"

  - type: single
    text: "За сохранность каких средств на рабочем месте отвечает наблюдающий по пункту 47.12?"
    options:
      - "Заземлений, ограждений, плакатов, знаков безопасности и запирающих устройств приводов"
      - "Только строительных материалов"
      - "Только средств связи СМО"
      - "Только личного инструмента работников"
    answer: 1
    explanation: "Пункт 47.12 перечисляет установленные заземления, ограждения, плакаты, знаки безопасности и запирающие устройства приводов."
    source: "Пункт 47.12"

  - type: single
    text: "За какую безопасность работников СМО отвечает наблюдающий по пункту 47.12?"
    options:
      - "За безопасность в отношении поражения электрическим током"
      - "Только за пожарную безопасность бытовых помещений"
      - "Только за транспортную безопасность"
