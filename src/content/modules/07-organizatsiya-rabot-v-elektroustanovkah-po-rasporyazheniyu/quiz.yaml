  - type: single
    text: "Где выполняются записи при работах по распоряжениям, которые оперативный персонал выдает подчиненному оперативному персоналу в смене?"
    options:
      - "Только в оперативных журналах"
      - "Только в журнале выдачи инструмента"
      - "Только на обратной стороне удостоверения"
      - "Записи не требуются"
    answer: 1
    explanation: "Пункт 7.16 устанавливает, что записи о начале, окончании, подготовке рабочего места, характере работы и составе бригады выполняются только в оперативных журналах."
    source: "Пункт 7.16"
  - type: single
    text: "Кто может единолично выполнять по распоряжению работы с переносным компьютером в электроустановках до и выше 1000 В?"
    options:
      - "Один работник с группой IV и правом быть производителем работ"
      - "Любой работник с группой II"
      - "Только два работника с группой III"
      - "Работник без права быть производителем работ"
    answer: 1
    explanation: "Пункт 7.17 разрешает такие работы одному работнику с группой IV, имеющему право быть производителем работ."
    source: "Пункт 7.17"
  - type: single
    text: "Какая из работ относится к единоличным работам с переносным компьютером по пункту 7.17?"
    options:
      - "Скачивание аварийных осциллограмм из терминалов релейной защиты и автоматики"
      - "Замена силового трансформатора"
      - "Монтаж опоры ВЛ"
      - "Работа на сборных шинах РУ"
    answer: 1
    explanation: "Пункт 7.17 включает скачивание аварийных осциллограмм из терминалов РЗА в перечень работ, выполняемых единолично работником с группой IV."
    source: "Пункт 7.17"
  - type: single
    text: "Каким составом выполняются по распоряжению подключение регистраторов качества электроэнергии, осциллографов во вторичные цепи РЗА и снятие векторных диаграмм?"
    options:
      - "Двумя работниками: производителем работ с группой IV и членом бригады с группой не ниже III"
      - "Одним работником с группой II"
      - "Любым числом работников без требований к группе"
      - "Только наблюдающим без производителя работ"
    answer: 1
    explanation: "Пункт 7.18 требует для этих работ двух работников: производителя с группой IV и члена бригады с группой не ниже III."
    source: "Пункт 7.18"
