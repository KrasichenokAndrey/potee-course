title: "Проверка по разделу XX"
moduleSlug: "20-ohrana-truda-pri-ustanovke-zazemleniy"
draft: false
questions:
  - type: single
    text: "Когда необходимо устанавливать заземления на токоведущие части?"
    options:
      - "Непосредственно после проверки отсутствия напряжения"
      - "До проверки отсутствия напряжения"
      - "Только после полного окончания работ"
      - "В любое удобное время"
    answer: 1
    explanation: "Пункт 20.1 требует устанавливать заземления на токоведущие части непосредственно после проверки отсутствия напряжения."
    source: "Пункт 20.1"
  - type: single
    text: "Что нужно сделать первым при установке переносного заземления?"
    options:
      - "Присоединить переносное заземление к заземляющему устройству"
      - "Установить переносное заземление на токоведущие части"
      - "Снять переносные плакаты"
      - "Отключить освещение рабочего места"
    answer: 1
    explanation: "Пункт 20.2 устанавливает последовательность: сначала переносное заземление присоединяют к заземляющему устройству."
    source: "Пункт 20.2"
  - type: single
    text: "Когда переносное заземление устанавливают на токоведущие части?"
    options:
      - "После присоединения к заземляющему устройству и проверки отсутствия напряжения"
      - "До присоединения к заземляющему устройству"
      - "До проверки отсутствия напряжения"
      - "Только после снятия всех ограждений"
    answer: 1
    explanation: "Пункт 20.2 требует после присоединения к заземляющему устройству и проверки отсутствия напряжения установить заземление на токоведущие части."
    source: "Пункт 20.2"
  - type: single
    text: "В какой последовательности снимается переносное заземление?"
    options:
      - "Сначала с токоведущих частей, затем от заземляющего устройства"
      - "Сначала от заземляющего устройства, затем с токоведущих частей"
      - "Одновременно с обеих сторон"
      - "Последовательность не имеет значения"
    answer: 1
    explanation: "Пункт 20.2 требует снимать переносное заземление в обратной последовательности: сначала с токоведущих частей, затем отсоединять от заземляющего устройства."
    source: "Пункт 20.2"
  - type: single
    text: "В каких средствах защиты выполняются установка и снятие переносных заземлений?"
    options:
      - "В диэлектрических перчатках"
      - "Только в хлопчатобумажных перчатках"
      - "Без перчаток"
      - "Только в защитных очках"
    answer: 1
    explanation: "Пункт 20.3 требует выполнять установку и снятие переносных заземлений в диэлектрических перчатках."
    source: "Пункт 20.3"
  - type: single
    text: "Какое дополнительное средство применяется при установке и снятии переносных заземлений в электроустановках выше 1000 В?"
    options:
      - "Изолирующая штанга"
      - "Контрольная лампа"
      - "Металлическая линейка"
      - "Обычный гаечный ключ без изоляции"
    answer: 1
    explanation: "Пункт 20.3 требует применять изолирующую штангу в электроустановках напряжением выше 1000 В."
    source: "Пункт 20.3"
  - type: single
    text: "Чем следует закреплять зажимы переносных заземлений?"
    options:
      - "Той же изолирующей штангой"
      - "Рукой без средств защиты"
      - "Любым металлическим предметом"
      - "Контрольной лампой"
    answer: 1
    explanation: "Пункт 20.3 требует закреплять зажимы переносных заземлений той же изолирующей штангой."
    source: "Пункт 20.3"
  - type: single
    text: "Можно ли касаться проводящих частей заземления при установке, снятии переносного заземления или выполнении работы?"
    options:
      - "Нет, запрещается"
      - "Да, если надеты обычные перчатки"
      - "Да, если напряжение проверено"
      - "Да, если касание кратковременное"
    answer: 1
    explanation: "Пункт 20.3 запрещает касаться проводящих частей заземления при установке, снятии или выполнении работы."
    source: "Пункт 20.3"
  - type: single
    text: "Можно ли пользоваться для заземления проводниками, не предназначенными для этой цели?"
    options:
      - "Нет, запрещается, кроме случаев, указанных в пункте 27.2 Правил"
      - "Да, всегда можно"
      - "Да, если проводник выглядит исправным"
      - "Да, только при работах выше 1000 В"
    answer: 1
    explanation: "Пункт 20.4 запрещает использовать для заземления проводники, не предназначенные для этой цели, кроме исключения пункта 27.2."
    source: "Пункт 20.4"
