title: "Проверка по разделу II"
moduleSlug: "02-trebovaniya-k-rabotnikam-dopuskaemym-k-vypolneniyu-rabot-v-elektrous"
draft: false
questions:
  - type: single
    text: "Что должен пройти работник до допуска к самостоятельной работе?"
    options:
      - "Только вводный инструктаж"
      - "Обучение безопасным методам и приемам выполнения работ"
      - "Только медицинский осмотр без проверки знаний"
    answer: 2
    explanation: "Раздел II начинается с требований к обучению безопасным методам и приемам выполнения работ."
    source: "Пункт 2.1"
  - type: single
    text: "Кому присваивается группа I по электробезопасности при наличии риска поражения током?"
    options:
      - "Неэлектротехническому персоналу"
      - "Только руководителям организации"
      - "Только работникам оперативного персонала"
    answer: 1
    explanation: "Группа I относится к неэлектротехническому персоналу, если при работе может возникнуть опасность поражения электрическим током."
    source: "Пункт 2.3"
  - type: single
    text: "Где подтверждается право на проведение специальных работ?"
    options:
      - "Только в трудовом договоре"
      - "Записью в удостоверении о проверке знаний"
      - "В устном распоряжении руководителя"
    answer: 2
    explanation: "Право на специальные работы подтверждается соответствующей записью в удостоверении."
    source: "Пункт 2.8"
