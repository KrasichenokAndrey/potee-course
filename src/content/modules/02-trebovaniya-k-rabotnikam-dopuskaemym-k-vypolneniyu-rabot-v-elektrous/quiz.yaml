    explanation: "Пункт 2.3 требует при проверке знаний подтверждать имеющуюся группу применительно к новой должности и оборудованию электроустановок на новом участке."
    source: "Пункт 2.3"
  - type: single
    text: "Какую начальную группу нельзя присвоить работнику при переводе с обслуживания электроустановок ниже 1000 В на обслуживание электроустановок выше 1000 В?"
