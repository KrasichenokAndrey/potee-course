    source: "Пункт 2.3"
  - type: single
    text: "С какого возраста работникам разрешается присваивать группу III по электробезопасности?"
    options:
      - "С 16 лет"
      - "Только по достижении 18-летнего возраста"
      - "С любого возраста при наличии стажа"
      - "Только после 21 года"
