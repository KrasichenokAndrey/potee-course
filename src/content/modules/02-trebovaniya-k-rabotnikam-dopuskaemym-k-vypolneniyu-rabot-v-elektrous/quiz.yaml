title: "Проверка по разделу II"
moduleSlug: "02-trebovaniya-k-rabotnikam-dopuskaemym-k-vypolneniyu-rabot-v-elektrous"
draft: false
questions:
  - type: single
    text: "Какое обучение обязаны проходить работники, выполняющие работы в электроустановках?"
    options:
      - "Только обучение работе с документацией"
      - "Обучение безопасным методам и приемам выполнения работ в электроустановках"
      - "Только обучение правилам внутреннего трудового распорядка"
      - "Только обучение пользованию средствами связи"
    answer: 2
    explanation: "Пункт 2.1 устанавливает обязанность работников проходить обучение безопасным методам и приемам выполнения работ в электроустановках."
    source: "Пункт 2.1"
  - type: single
    text: "Когда работники должны пройти обучение по оказанию первой помощи пострадавшему на производстве?"
    options:
      - "До допуска к самостоятельной работе"
      - "После первого года работы"
      - "Только после несчастного случая"
      - "Только перед очередной проверкой знаний"
    answer: 1
    explanation: "Пункт 2.2 требует проходить обучение оказанию первой помощи до допуска к самостоятельной работе."
    source: "Пункт 2.2"
  - type: single
    text: "Чему дополнительно должен быть обучен электротехнический персонал, кроме оказания первой помощи?"
    options:
      - "Приемам освобождения пострадавшего от действия электрического тока с учетом специфики обслуживаемых электроустановок"
      - "Порядку ведения бухгалтерского учета электроэнергии"
      - "Проектированию зданий и сооружений"
      - "Правилам коммерческих переговоров с поставщиками"
    answer: 1
    explanation: "Пункт 2.2 отдельно требует обучать электротехнический персонал приемам освобождения пострадавшего от действия электрического тока."
    source: "Пункт 2.2"
  - type: single
    text: "Кто относится к электротехническому персоналу по разделу II?"
    options:
      - "Персонал, специально подготовленный для монтажа, наладки, ремонта, эксплуатации, технического обслуживания и управления режимом работы электроустановок"
      - "Любой работник организации независимо от выполняемых функций"
      - "Только специалисты по закупкам электрического оборудования"
      - "Только работники, не имеющие доступа к электроустановкам"
    answer: 1
    explanation: "Пункт 2.3 относит к электротехническому персоналу специально подготовленных работников, организующих и осуществляющих работы с электроустановками и управление их режимом."
    source: "Пункт 2.3"
  - type: single
    text: "Какой персонал относится к электротехнологическому?"
    options:
      - "Персонал, у которого в управляемом технологическом процессе основной составляющей является электрическая энергия"
      - "Только персонал отдела кадров"
      - "Только работники, выполняющие уборку помещений"
      - "Только работники, не использующие электроэнергию в процессе труда"
    answer: 1
    explanation: "Пункт 2.3 указывает, что к электротехнологическому относится персонал, у которого электрическая энергия является основной составляющей управляемого технологического процесса."
    source: "Пункт 2.3"
  - type: single
    text: "Какие работники должны пройти проверку знаний требований Правил и других требований безопасности?"
    options:
      - "Только работники, впервые пришедшие на предприятие"
      - "Электротехнический и электротехнологический персонал, а также должностные лица и специалисты по охране труда, контролирующие электроустановки"
      - "Только руководитель организации"
      - "Только работники, не связанные с эксплуатацией электроустановок"
    answer: 2
    explanation: "Пункт 2.3 требует проверки знаний для электротехнического и электротехнологического персонала, а также для лиц, контролирующих безопасность при эксплуатации электроустановок."
    source: "Пункт 2.3"
  - type: single
    text: "Как соотносятся требования Правил для электротехнического и электротехнологического персонала?"
    options:
      - "Требования для электротехнического персонала обязательны и для электротехнологического персонала"
      - "Для электротехнологического персонала требования Правил не применяются"
      - "Электротехнологический персонал выполняет только требования производителя оборудования"
      - "Эти категории персонала всегда освобождены от проверки знаний"
    answer: 1
    explanation: "Пункт 2.3 прямо говорит, что требования, установленные для электротехнического персонала, обязательны и для электротехнологического персонала."
    source: "Пункт 2.3"
  - type: single
    text: "Какой характер имеют требования к персоналу по электробезопасности, приведенные в приложении N 1 к Правилам?"
    options:
      - "Они являются минимальными и могут быть дополнены решением руководителя организации"
      - "Они являются максимальными и не могут дополняться"
      - "Они применяются только к неэлектротехническому персоналу"
      - "Они носят только справочный характер и не используются при присвоении групп"
    answer: 1
    explanation: "Пункт 2.3 устанавливает, что требования приложения N 1 являются минимальными и могут быть дополнены решением руководителя организации."
    source: "Пункт 2.3"
  - type: single
    text: "Кому присваивается группа I по электробезопасности?"
    options:
      - "Неэлектротехническому персоналу, выполняющему работы, при которых может возникнуть опасность поражения электрическим током"
      - "Только работникам оперативного персонала"
      - "Только руководителям организаций электроэнергетики"
      - "Любому работнику автоматически при приеме на работу"
    answer: 1
    explanation: "Пункт 2.3 предусматривает присвоение группы I неэлектротехническому персоналу при наличии риска поражения электрическим током."
    source: "Пункт 2.3"
  - type: single
    text: "Кто определяет перечень должностей и рабочих мест, где требуется группа I по электробезопасности?"
    options:
      - "Руководитель организации или обособленного подразделения"
      - "Любой работник бригады"
      - "Поставщик электрооборудования"
      - "Только сам работник"
    answer: 1
    explanation: "Пункт 2.3 возлагает определение такого перечня на руководителя организации или обособленного подразделения."
    source: "Пункт 2.3"
  - type: single
    text: "Как оформляется присвоение группы I по электробезопасности?"
    options:
      - "Только устным сообщением работнику"
      - "Записью в журнале с данными работника, датой, должностью и подписями проверяемого и проверяющего"
      - "Только записью в трудовой книжке"
      - "Только приказом о приеме на работу"
    answer: 2
    explanation: "Пункт 2.3 требует оформлять присвоение группы I в журнале с указанием сведений о работнике, даты и подписей."
