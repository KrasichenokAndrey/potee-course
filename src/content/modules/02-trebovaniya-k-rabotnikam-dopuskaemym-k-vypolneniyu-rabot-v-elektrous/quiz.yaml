      - "Группу IV"
      - "Группу V"
      - "Группу I"
    answer: 3
    explanation: "Пункт 2.3 устанавливает для специалистов по охране труда субъектов электроэнергетики группу V по электробезопасности."
    source: "Пункт 2.3"
  - type: single
