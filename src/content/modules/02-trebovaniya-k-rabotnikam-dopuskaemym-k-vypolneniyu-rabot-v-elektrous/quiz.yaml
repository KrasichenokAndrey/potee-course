    explanation: "Пункт 2.3 устанавливает, что инструктаж для присвоения группы I завершается устным опросом и, при необходимости, проверкой навыков безопасной работы и оказания первой помощи."
    source: "Пункт 2.3"
  - type: single
    text: "Кто вправе проводить присвоение группы I по электробезопасности?"
    options:
      - "Работник из числа электротехнического персонала с группой III или специалист по охране труда с группой IV и выше, назначенный распоряжением руководителя"
      - "Любой работник, уже имеющий группу I"
