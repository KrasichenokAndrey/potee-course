title: "Проверка по разделу XXI"
moduleSlug: "21-ohrana-truda-pri-ustanovke-zazemleniy-v-raspredelitelnyh-ustroystvah"
draft: false
questions:
  - type: single
    text: "Какие токоведущие части должны быть заземлены в электроустановках выше 1000 В на отключенном для работ участке?"
    options:
      - "Токоведущие части всех фаз или полюсов со всех сторон, откуда может быть подано напряжение"
      - "Только одна фаза со стороны рабочего места"
      - "Только нулевой проводник"
      - "Только корпус оборудования"
    answer: 1
    explanation: "Пункт 21.1 требует заземлять токоведущие части всех фаз или полюсов отключенного участка со всех сторон возможной подачи напряжения."
    source: "Пункт 21.1"
  - type: single
    text: "Какое заземление достаточно установить на отключенные для работы сборные шины РУ?"
    options:
      - "Одно заземление"
      - "По одному заземлению на каждое присоединение"
      - "Только заземление на стороне ВЛ"
      - "Заземление сборных шин не требуется"
    answer: 1
    explanation: "Пункт 21.1 делает исключение для отключенных сборных шин РУ: на них достаточно установить одно заземление."
    source: "Пункт 21.1"
  - type: single
    text: "Что должно быть установлено при работах на отключенном линейном разъединителе на провода спусков со стороны ВЛ?"
    options:
      - "Дополнительное заземление, не нарушаемое при манипуляциях с разъединителем"
      - "Только запрещающий плакат"
      - "Только временное ограждение"
      - "Ничего, если на разъединителе есть заземляющие ножи"
    answer: 1
    explanation: "Пункт 21.1 требует дополнительное заземление на провода спусков со стороны ВЛ независимо от наличия заземляющих ножей на разъединителе."
    source: "Пункт 21.1"
  - type: single
    text: "Чем должны быть отделены заземленные токоведущие части от токоведущих частей, находящихся под напряжением?"
    options:
      - "Видимым разрывом, кроме случаев, указанных в пункте 17.2 Правил"
      - "Только переносным плакатом"
      - "Только устным предупреждением"
      - "Только закрытой дверью помещения"
    answer: 1
    explanation: "Пункт 21.2 требует отделять заземленные части от частей под напряжением видимым разрывом, с учетом исключений пункта 17.2."
    source: "Пункт 21.2"
  - type: single
    text: "Чем могут быть отделены установленные заземления от токоведущих частей, на которых непосредственно ведется работа?"
    options:
      - "Отключенными коммутационными аппаратами, снятыми предохранителями, демонтированными шинами или проводами, выкатными элементами комплектных устройств"
      - "Только сигнальной лентой"
      - "Только устным распоряжением"
      - "Только записью в оперативном журнале"
    answer: 1
    explanation: "Пункт 21.2 перечисляет средства отделения установленных заземлений от частей, где непосредственно выполняется работа."
    source: "Пункт 21.2"
  - type: single
    text: "Когда непосредственно на рабочем месте нужно дополнительно установить заземление на токоведущие части?"
    options:
      - "Когда эти части могут оказаться под наведенным напряжением или потенциалом"
      - "Только при отсутствии наряда-допуска"
      - "Только после полного окончания работ"
      - "Всегда независимо от условий"
    answer: 1
    explanation: "Пункт 21.2 требует дополнительное заземление непосредственно на рабочем месте при возможности появления наведенного напряжения."
    source: "Пункт 21.2"
  - type: single
    text: "В каких местах следует присоединять переносные заземления к токоведущим частям и заземляющему устройству?"
    options:
      - "В местах, очищенных от краски"
      - "В любых окрашенных местах"
      - "Только на изолированных участках"
      - "Только через слой грязи и краски"
    answer: 1
    explanation: "Пункт 21.3 требует присоединять переносные заземления в местах, очищенных от краски."
    source: "Пункт 21.3"
  - type: single
    text: "Что должно быть сделано с шинами РУ, щитов и сборок до 1000 В при работах на сборных шинах?"
    options:
      - "Напряжение с шин должно быть снято, а шины, кроме выполненных изолированным проводом, должны быть заземлены"
      - "Шины должны оставаться под напряжением"
      - "Шины заземляются только после окончания работ"
      - "Заземление шин всегда запрещено"
    answer: 1
    explanation: "Пункт 21.4 требует снять напряжение со сборных шин до 1000 В и заземлить их, кроме шин из изолированного провода."
    source: "Пункт 21.4"
  - type: single
    text: "Кто определяет необходимость и возможность заземления присоединений РУ, щитов, сборок до 1000 В и подключенного оборудования?"
    options:
      - "Выдающий наряд-допуск или распоряжение"
      - "Любой член бригады"
      - "Только работник склада"
      - "Только водитель механизма"
    answer: 1
    explanation: "Пункт 21.4 возлагает определение необходимости и возможности такого заземления на выдающего наряд-допуск или распоряжение."
    source: "Пункт 21.4"
  - type: single
    text: "Когда разрешается временно снимать заземления, установленные при подготовке рабочего места?"
    options:
      - "Если это требуется по характеру выполняемых работ, например для измерения сопротивления изоляции"
      - "В любое время по желанию члена бригады"
      - "Только для удобства прохода"
      - "Никогда не разрешается"
    answer: 1
    explanation: "Пункт 21.5 разрешает временно снимать заземления, если это требуется по характеру работ, например при измерении сопротивления изоляции."
    source: "Пункт 21.5"
  - type: single
    text: "Кто выполняет временное снятие и повторную установку заземлений?"
    options:
      - "Оперативный персонал либо, по указанию выдающего наряд-допуск, производитель работ"
      - "Любой член бригады без указания"
      - "Только наблюдающий без права на это"
      - "Только работник сторонней организации"
    answer: 1
    explanation: "Пункт 21.5 устанавливает, что эти операции выполняет оперативный персонал или производитель работ по указанию выдающего наряд."
    source: "Пункт 21.5"
  - type: single
    text: "Где должно быть записано разрешение на временное снятие заземлений и выполнение этих операций производителем работ?"
    options:
      - "В строке наряда-допуска «Отдельные указания» с указанием места и цели снятия"
      - "Только в журнале выдачи инструмента"
      - "Только в устной форме"
      - "Только на схеме без записи в наряде"
    answer: 1
    explanation: "Пункт 21.5 требует внести разрешение в строку «Отдельные указания» с записью, где и для какой цели снимаются заземления."
    source: "Пункт 21.5"
  - type: single
    text: "Что должно быть разработано для электроустановок, где установка заземления опасна или невозможна?"
    options:
      - "Дополнительные мероприятия по обеспечению безопасности работ"
      - "Только новая система нумерации нарядов"
      - "Только график осмотров"
      - "Разрешение работать без дополнительных мер"
    answer: 1
    explanation: "Пункт 21.6 требует разработать дополнительные мероприятия безопасности для электроустановок, где установка заземления опасна или невозможна."
    source: "Пункт 21.6"
  - type: single
    text: "Какая мера может входить в дополнительные мероприятия, если установка заземления опасна или невозможна?"
    options:
      - "Установка диэлектрических колпаков, диэлектрических накладок или отсоединение проводов, кабелей и шин"
      - "Снятие всех предупреждающих плакатов"
      - "Работа без подготовки рабочего места"
      - "Замена наряда устным распоряжением"
    answer: 1
    explanation: "Пункт 21.6 приводит примеры дополнительных мер: диэлектрические колпаки, накладки, отсоединение проводов, кабелей и шин."
    source: "Пункт 21.6"
  - type: single
    text: "Кем утверждается перечень электроустановок, где установка заземления опасна или невозможна?"
    options:
      - "Руководителем организации или руководителем обособленного подразделения"
      - "Любым производителем работ"
      - "Только членами бригады"
      - "Работником, получившим ключи"
    answer: 1
    explanation: "Пункт 21.6 требует утверждать такой перечень руководителем организации или обособленного подразделения и доводить его до работников."
    source: "Пункт 21.6"
  - type: single
    text: "Кто может выполнять установку и снятие заземлений в электроустановках до 1000 В?"
    options:
      - "Один работник оперативного персонала с группой III"
      - "Один работник с группой I"
      - "Любой работник без группы"
      - "Только два работника с группами IV и III"
    answer: 1
    explanation: "Пункт 21.7 разрешает выполнять эти операции одному работнику из числа оперативного персонала с группой III."
    source: "Пункт 21.7"
  - type: single
    text: "Каким составом устанавливаются переносные заземления в электроустановках выше 1000 В?"
    options:
      - "Двумя работниками: один с группой IV из оперативного персонала, другой с группой III"
      - "Одним работником с группой II"
      - "Любым одним членом бригады"
      - "Только работником без группы под наблюдением"
    answer: 1
    explanation: "Пункт 21.8 требует устанавливать переносные заземления выше 1000 В двумя работниками: с группой IV из оперативного персонала и с группой III."
    source: "Пункт 21.8"
  - type: single
    text: "Из какого персонала может быть второй работник с группой III при установке переносных заземлений выше 1000 В?"
    options:
      - "Из ремонтного персонала, а при заземлении присоединений потребителей - из персонала потребителей"
      - "Только из работников охраны"
      - "Только из неэлектротехнического персонала без допуска"
      - "Только из административного персонала без группы"
    answer: 1
    explanation: "Пункт 21.8 допускает, чтобы работник с группой III был из ремонтного персонала, а при заземлении присоединений потребителей - из персонала потребителей."
    source: "Пункт 21.8"
  - type: single
    text: "Кто имеет право включать заземляющие ножи в электроустановках выше 1000 В?"
    options:
      - "Один работник оперативного персонала с группой IV"
      - "Один работник с группой II"
      - "Любой член бригады"
      - "Только два работника с группой I"
    answer: 1
    explanation: "Пункт 21.8 устанавливает, что включать заземляющие ножи имеет право один оперативный работник с группой IV."
    source: "Пункт 21.8"
  - type: single
    text: "Кто имеет право единолично отключать заземляющие ножи и снимать переносные заземления?"
    options:
      - "Работник оперативного персонала с группой III"
      - "Любой работник с группой I"
      - "Только член бригады без допуска"
      - "Только работник потребителя без группы"
    answer: 1
    explanation: "Пункт 21.8 разрешает единолично отключать заземляющие ножи и снимать переносные заземления оперативному работнику с группой III."
    source: "Пункт 21.8"
