title: "Проверка по разделу XII"
moduleSlug: "12-perevod-na-drugoe-rabochee-mesto"
draft: false
questions:
  - type: single
    text: "Кто осуществляет перевод бригады на другое рабочее место в РУ напряжением выше 1000 В?"
    options:
      - "Допускающий"
      - "Любой член бригады"
      - "Только работник склада"
      - "Только водитель автомобиля"
    answer: 1
    explanation: "Пункт 12.1 устанавливает, что в РУ напряжением выше 1000 В перевод бригады на другое рабочее место осуществляет допускающий."
    source: "Пункт 12.1"
  - type: single
    text: "Кто, кроме допускающего, может выполнять перевод бригады в РУ выше 1000 В при наличии поручения выдающего наряд-допуск?"
    options:
      - "Ответственный руководитель, производитель работ или наблюдающий"
      - "Любой член бригады с группой II"
      - "Только работник охраны"
      - "Только представитель подрядчика без записи в наряде"
    answer: 1
    explanation: "Пункт 12.1 разрешает ответственному руководителю, производителю работ или наблюдающему выполнять перевод по поручению выдающего наряд-допуск."
    source: "Пункт 12.1"
  - type: single
    text: "Где должно быть зафиксировано поручение ответственному руководителю, производителю работ или наблюдающему выполнять перевод?"
    options:
      - "В строке «Отдельные указания» наряда-допуска"
      - "Только в журнале выдачи инструмента"
      - "Только в личном удостоверении"
      - "Только устно без записи"
    answer: 1
    explanation: "Пункт 12.1 требует запись в строке «Отдельные указания» наряда-допуска."
    source: "Пункт 12.1"
  - type: single
    text: "Где указывается перевод бригады на другое рабочее место?"
    options:
      - "В наряде-допуске"
      - "Только в табеле учета рабочего времени"
      - "Только на схеме электроустановки"
      - "Только в устной форме"
    answer: 1
    explanation: "Пункт 12.2 устанавливает, что перевод на другое рабочее место указывается в наряде-допуске."
    source: "Пункт 12.2"
  - type: single
    text: "Как оформляется перевод, выполняемый допускающим из числа оперативного персонала?"
    options:
      - "В двух экземплярах наряда-допуска, кроме случаев, предусмотренных пунктом 6.1"
      - "Только в одном экземпляре всегда"
      - "Только в журнале выдачи ключей"
      - "Не оформляется"
    answer: 1
    explanation: "Пункт 12.2 требует оформлять такой перевод в двух экземплярах наряда-допуска, за исключением случаев пункта 6.1."
    source: "Пункт 12.2"
  - type: single
    text: "Кто осуществляет перевод на другое рабочее место в РУ до 1000 В, а также на одной ВЛ, ВЛС или КЛ?"
    options:
      - "Производитель работ или наблюдающий"
      - "Только допускающий"
      - "Любой член бригады"
      - "Только работник, выдавший ключ"
    answer: 1
    explanation: "Пункт 12.3 возлагает перевод в этих случаях на производителя работ или наблюдающего."
    source: "Пункт 12.3"
  - type: single
    text: "Нужно ли оформлять в наряде перевод на другое рабочее место в РУ до 1000 В, а также на одной ВЛ, ВЛС или КЛ?"
    options:
      - "Нет, перевод выполняется без оформления в наряде"
      - "Да, всегда в двух экземплярах"
      - "Да, только после окончания работ"
      - "Перевод в этих случаях запрещен"
    answer: 1
    explanation: "Пункт 12.3 указывает, что такой перевод выполняется производителем работ или наблюдающим без оформления в наряде."
    source: "Пункт 12.3"
  - type: single
    text: "Какой перевод подлежит оформлению в наряде-допуске при выполнении работ без отключения оборудования?"
    options:
      - "Только перевод бригады из одного РУ в другое"
      - "Каждое перемещение внутри одного рабочего места"
      - "Только выход на обед"
      - "Никакой перевод не оформляется"
    answer: 1
    explanation: "Пункт 12.4 требует оформлять в наряде-допуске только перевод бригады из одного РУ в другое при работах без отключения оборудования."
    source: "Пункт 12.4"
