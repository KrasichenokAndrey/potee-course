title: "Проверка по разделу XXX"
moduleSlug: "30-ohrana-truda-pri-vypolnenii-rabot-na-machtovyh-stolbovyh-transformat"
draft: false
questions:
  - type: single
    text: "Какие работы на оборудовании ТП и КТП разрешаются без отключения питающей линии выше 1000 В?"
    options:
      - "Только осмотры, ремонт и техническое обслуживание, которые можно выполнять стоя на площадке"
      - "Любые работы при наличии наряда-допуска"
      - "Только работы внутри щита до 1000 В без учета расстояний"
      - "Только работы с земли без подъема на площадку"
    answer: 1
    explanation: "Пункт 30.1 разрешает без отключения питающей линии выше 1000 В только те осмотры, ремонт и обслуживание, которые возможно выполнять стоя на площадке."
    source: "Пункт 30.1"
  - type: single
    text: "Какое условие по расстояниям должно соблюдаться при работах на оборудовании ТП и КТП без отключения питающей линии выше 1000 В?"
    options:
      - "Расстояния до токоведущих частей под напряжением должны соответствовать таблице N 1"
      - "Расстояние должно быть любым, если работа кратковременная"
      - "Достаточно расстояния 0,1 м во всех случаях"
      - "Расстояния определяются только производителем работ без учета Правил"
    answer: 1
    explanation: "Пункт 30.1 требует соблюдать расстояния до токоведущих частей, находящихся под напряжением, указанные в таблице N 1."
    source: "Пункт 30.1"
  - type: single
    text: "Что нужно сделать, если расстояния до токоведущих частей выше 1000 В меньше допустимых?"
    options:
      - "Выполнять работу при отключении и заземлении этих токоведущих частей"
      - "Продолжить работу с дополнительным наблюдающим"
      - "Ограничиться вывешиванием плаката"
      - "Работать только в диэлектрических перчатках без отключения"
    answer: 1
    explanation: "Пункт 30.1 требует при расстояниях меньше допустимых выполнять работу с отключением и заземлением токоведущих частей выше 1000 В."
    source: "Пункт 30.1"
  - type: single
    text: "Когда разрешается допуск к работам на мачтовых ТП и КТП киоскового типа?"
    options:
      - "Только после установленной последовательности отключений и наложения заземления на токоведущие части подстанции"
      - "Сразу после прибытия бригады"
      - "После отключения только аппаратов до 1000 В"
      - "После проверки освещения площадки"
    answer: 1
    explanation: "Пункт 30.2 требует перед допуском выполнить отключения и наложить заземление на токоведущие части подстанции."
    source: "Пункт 30.2"
  - type: single
    text: "Зависит ли допуск к работам на мачтовых ТП и КТП киоскового типа от наличия напряжения на линии?"
    options:
      - "Нет, порядок допуска применяется независимо от наличия или отсутствия напряжения на линии"
      - "Да, меры нужны только при наличии напряжения"
      - "Да, меры нужны только при отсутствии напряжения"
      - "Да, порядок определяется только диспетчером без требований Правил"
    answer: 1
    explanation: "Пункт 30.2 прямо указывает, что допуск производится в установленном порядке независимо от наличия или отсутствия напряжения на линии."
    source: "Пункт 30.2"
  - type: single
    text: "Что отключают первым при подготовке допуска к работам на мачтовых ТП и КТП киоскового типа?"
    options:
      - "Коммутационные аппараты напряжением до 1000 В"
      - "Линейный разъединитель напряжением выше 1000 В"
      - "Стационарную лестницу"
      - "Заземляющее устройство"
    answer: 1
    explanation: "Пункт 30.2 устанавливает последовательность: сначала отключают коммутационные аппараты до 1000 В."
    source: "Пункт 30.2"
  - type: single
    text: "Что отключают после коммутационных аппаратов до 1000 В при подготовке мачтовой ТП или КТП киоскового типа?"
    options:
      - "Линейный разъединитель напряжением выше 1000 В"
      - "Все заземляющие ножи"
      - "Только освещение площадки"
      - "Только цепи сигнализации"
    answer: 1
    explanation: "Пункт 30.2 требует после аппаратов до 1000 В отключить линейный разъединитель выше 1000 В."
    source: "Пункт 30.2"
  - type: single
    text: "Что должно быть сделано после отключения аппаратов до 1000 В и линейного разъединителя выше 1000 В?"
    options:
      - "На токоведущие части подстанции должно быть наложено заземление"
      - "Должны быть сняты все плакаты"
      - "Должны быть открыты приводы разъединителей"
      - "Должны быть сняты замки со шкафов"
    answer: 1
    explanation: "Пункт 30.2 требует после отключений наложить заземление на токоведущие части подстанции."
    source: "Пункт 30.2"
  - type: single
    text: "Что необходимо сделать, если не исключена подача напряжения 380/220 В на подстанцию?"
    options:
      - "Отключить линии 380/220 В с противоположной питающей стороны и принять меры против ошибочного или самопроизвольного включения"
      - "Оставить линии включенными, если отключена сторона выше 1000 В"
      - "Только вывесить плакат на площадке"
      - "Только предупредить бригаду устно"
    answer: 1
    explanation: "Пункт 30.2 требует при возможной подаче 380/220 В отключить эти линии с противоположной питающей стороны и принять меры против ошибочного или самопроизвольного включения."
    source: "Пункт 30.2"
  - type: single
    text: "Где накладывают заземления на линии 380/220 В, если не исключена обратная подача напряжения?"
    options:
      - "На подстанции на эти линии до коммутационных аппаратов"
      - "Только на противоположной питающей стороне"
      - "Только на корпус трансформатора"
      - "На любую ближайшую металлическую конструкцию"
    answer: 1
    explanation: "Пункт 30.2 требует наложить на подстанции заземления на линии 380/220 В до коммутационных аппаратов."
    source: "Пункт 30.2"
  - type: single
    text: "Что должно быть сделано с приводами разъединителей, выключателей нагрузки, шкафами выше 1000 В и щитами до 1000 В на мачтовых ТП и других устройствах без ограждений?"
    options:
      - "Они должны быть заперты на замок"
      - "Они должны быть оставлены открытыми"
      - "Они должны быть сняты"
      - "Они не требуют мер, если работа не начата"
    answer: 1
    explanation: "Пункт 30.3 требует запирать на замок эти приводы, шкафы и щиты на устройствах, не имеющих ограждений."
    source: "Пункт 30.3"
  - type: single
    text: "Какие требования установлены к стационарным лестницам у площадки обслуживания мачтовой ТП?"
    options:
      - "Они должны быть сблокированы с разъединителями и заперты на замок"
      - "Они должны быть свободно доступны всем работникам"
      - "Они должны быть сняты перед каждым осмотром"
      - "Они должны быть только окрашены сигнальной краской"
    answer: 1
    explanation: "Пункт 30.3 требует, чтобы стационарные лестницы у площадки обслуживания были сблокированы с разъединителями и заперты на замок."
    source: "Пункт 30.3"
