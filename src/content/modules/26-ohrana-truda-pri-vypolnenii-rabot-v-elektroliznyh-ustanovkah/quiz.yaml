      - "Если включена вентиляция помещения"
      - "Если ресиверы продувались азотом"
    answer: 1
    explanation: "Пункт 26.2 запрещает работу электролизеров, когда уровень жидкости в смотровых стеклах регуляторов давления не виден."
    source: "Пункт 26.2"
