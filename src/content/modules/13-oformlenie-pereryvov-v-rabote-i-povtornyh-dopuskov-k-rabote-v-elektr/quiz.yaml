title: "Проверка по разделу XIII"
moduleSlug: "13-oformlenie-pereryvov-v-rabote-i-povtornyh-dopuskov-k-rabote-v-elektr"
draft: false
questions:
  - type: single
    text: "Что должна сделать бригада при перерыве в работе в течение рабочего дня?"
    options:
      - "Быть удалена с рабочего места, а двери РУ должны быть закрыты на замок"
      - "Оставаться на рабочем месте без производителя работ"
      - "Снять все заземления"
      - "Закрыть наряд-допуск полностью"
    answer: 1
    explanation: "Пункт 13.1 требует при перерыве в течение рабочего дня удалить бригаду с рабочего места и закрыть двери РУ на замок."
    source: "Пункт 13.1"
  - type: single
    text: "У кого остается наряд-допуск при перерыве в работе в течение рабочего дня?"
    options:
      - "У производителя работ или наблюдающего"
      - "У любого члена бригады"
      - "Только у работника охраны"
      - "Уничтожается на время перерыва"
    answer: 1
    explanation: "Пункт 13.1 устанавливает, что при таком перерыве наряд-допуск остается у производителя работ или наблюдающего."
    source: "Пункт 13.1"
  - type: single
    text: "Могут ли члены бригады возвращаться после перерыва на рабочее место без производителя работ или наблюдающего?"
    options:
      - "Нет, не имеют права"
      - "Да, если перерыв был коротким"
      - "Да, если дверь РУ открыта"
      - "Да, если у них группа II"
    answer: 1
    explanation: "Пункт 13.1 запрещает членам бригады возвращаться после перерыва на рабочее место без производителя работ или наблюдающего."
    source: "Пункт 13.1"
  - type: single
    text: "Кто выполняет допуск к работе после перерыва в течение рабочего дня?"
    options:
      - "Производитель работ или наблюдающий без указания в наряде-допуске"
      - "Только допускающий с новым нарядом"
      - "Любой член бригады"
      - "Только работник, выдавший наряд"
    answer: 1
    explanation: "Пункт 13.1 устанавливает, что после такого перерыва допуск выполняет производитель работ или наблюдающий без отметки в наряде."
    source: "Пункт 13.1"
  - type: single
    text: "Что должна сделать бригада при перерыве в связи с окончанием рабочего дня?"
    options:
      - "Быть удалена с рабочего места"
      - "Оставаться на рабочем месте до следующего дня"
      - "Снять все плакаты и заземления во всех случаях"
      - "Передать наряд любому члену бригады"
    answer: 1
    explanation: "Пункт 13.2 требует удалить бригаду с рабочего места при перерыве из-за окончания рабочего дня."
    source: "Пункт 13.2"
  - type: single
    text: "Что происходит с плакатами безопасности, ограждениями, флажками и заземлениями при перерыве из-за окончания рабочего дня?"
    options:
      - "Они не снимаются"
      - "Они всегда снимаются"
      - "Снимаются только флажки"
      - "Снимаются только плакаты"
    answer: 1
    explanation: "Пункт 13.2 устанавливает, что плакаты безопасности, ограждения, флажки и заземления при таком перерыве не снимаются."
    source: "Пункт 13.2"
  - type: single
    text: "Кому производитель работ или наблюдающий должен сдать наряд-допуск после окончания рабочего дня?"
    options:
      - "Допускающему, а при его отсутствии оставить наряд в отведенном месте"
      - "Любому члену бригады"
      - "Только водителю"
      - "Только работнику склада"
    answer: 1
    explanation: "Пункт 13.2 требует сдать наряд допускающему, а при его отсутствии на рабочем месте оставить наряд в отведенном месте."
    source: "Пункт 13.2"
  - type: single
    text: "Когда производителю работ или наблюдающему разрешается оставлять наряд-допуск у себя после окончания рабочего дня?"
    options:
      - "В электроустановках, не имеющих местного оперативного персонала"
      - "Всегда, независимо от условий"
      - "Только при работе по распоряжению"
      - "Только если бригада не удалена с рабочего места"
    answer: 1
    explanation: "Пункт 13.2 разрешает оставлять наряд у производителя работ или наблюдающего в электроустановках без местного оперативного персонала."
    source: "Пункт 13.2"
  - type: single
    text: "Что должно быть снято при перерыве из-за окончания дня или смены при работах под напряжением на токоведущих частях?"
    options:
      - "Все установленные изолирующие покрытия, плакаты безопасности и приспособления"
      - "Только личные инструменты работников"
      - "Только заземления, установленные оперативным персоналом"
      - "Ничего не снимается ни при каких условиях"
    answer: 1
    explanation: "Пункт 13.2 требует при таких работах снять все установленные изолирующие покрытия, плакаты безопасности и приспособления."
    source: "Пункт 13.2"
  - type: single
    text: "Когда допускается не снимать изолирующие покрытия и плакаты безопасности при работах под напряжением после окончания дня или смены?"
    options:
      - "При применении временных ремонтных перемычек, обеспечивающих функционирование электроустановки во время ремонта"
      - "Всегда, если бригада вернется завтра"
      - "Только если производитель работ ушел первым"
      - "Только при отсутствии наряда-допуска"
    answer: 1
    explanation: "Пункт 13.2 допускает оставлять эти средства при применении временных ремонтных перемычек, обеспечивающих работу электроустановки во время ремонта."
    source: "Пункт 13.2"
  - type: single
    text: "Как производитель работ или наблюдающий оформляет окончание работы при перерыве из-за окончания рабочего дня?"
    options:
      - "Подписью в своем экземпляре наряда-допуска"
      - "Только устным сообщением членам бригады"
      - "Только записью в личном блокноте"
      - "Никак не оформляет"
    answer: 1
    explanation: "Пункт 13.2 требует оформлять окончание работы подписью в своем экземпляре наряда-допуска."
    source: "Пункт 13.2"
  - type: single
    text: "Кто осуществляет повторный допуск к работе в последующие дни на подготовленное рабочее место?"
    options:
      - "Допускающий или с его разрешения ответственный руководитель работ"
      - "Любой член бригады"
      - "Только работник, не участвующий в работе"
      - "Только представитель подрядчика"
    answer: 1
    explanation: "Пункт 13.3 устанавливает, что повторный допуск осуществляет допускающий или, с его разрешения, ответственный руководитель работ."
    source: "Пункт 13.3"
  - type: single
    text: "Где фиксируется разрешение на повторный допуск?"
    options:
      - "В оперативном журнале"
      - "Только в журнале выдачи инструмента"
      - "Только на схеме электроустановки"
      - "Нигде не фиксируется"
    answer: 1
    explanation: "Пункт 13.3 требует фиксировать разрешение на повторный допуск в оперативном журнале."
    source: "Пункт 13.3"
  - type: single
    text: "Требуется ли разрешение на допуск от вышестоящего оперативного персонала при повторном допуске в последующие дни?"
    options:
      - "Нет, не требуется"
      - "Да, требуется всегда"
      - "Требуется только при работах до 1000 В"
      - "Требуется только при наличии наблюдающего"
    answer: 1
    explanation: "Пункт 13.3 указывает, что при повторном допуске разрешение от вышестоящего оперативного персонала не требуется."
    source: "Пункт 13.3"
  - type: single
    text: "При каком условии производитель работ или наблюдающий может сам допустить бригаду к работе на подготовленное рабочее место?"
    options:
      - "Если есть разрешение допускающего и такое поручение записано в строке «Отдельные указания» наряда-допуска"
      - "Всегда, без разрешения"
      - "Только после выдачи нового наряда"
      - "Только если он не имеет наряда на руках"
    answer: 1
    explanation: "Пункт 13.3 разрешает производителю работ или наблюдающему допустить бригаду только с разрешения допускающего и при наличии поручения в «Отдельных указаниях»."
    source: "Пункт 13.3"
  - type: single
    text: "Что должен проверить производитель работ или наблюдающий при возобновлении работы на следующий день?"
    options:
      - "Целость и сохранность плакатов, ограждений, флажков и надежность заземлений"
      - "Только наличие питьевой воды"
      - "Только исправность автомобиля"
      - "Только фамилии работников без осмотра рабочего места"
    answer: 1
    explanation: "Пункт 13.3 требует перед возобновлением работы убедиться в сохранности плакатов, ограждений, флажков и надежности заземлений."
    source: "Пункт 13.3"
  - type: single
    text: "Как оформляется повторный допуск, выполняемый допускающим из числа оперативного персонала?"
    options:
      - "В двух экземплярах наряда-допуска"
      - "Только в одном экземпляре у производителя работ"
      - "Только устно"
      - "Не оформляется"
    answer: 1
    explanation: "Пункт 13.3 требует оформлять допуск, выполняемый допускающим из оперативного персонала, в двух экземплярах наряда-допуска."
    source: "Пункт 13.3"
  - type: single
    text: "Как оформляется повторный допуск, если его выполняет ответственный руководитель, производитель работ или наблюдающий?"
    options:
      - "В экземпляре наряда-допуска, находящемся у производителя работ или наблюдающего"
      - "Всегда в двух экземплярах"
      - "Только в оперативном журнале без наряда"
      - "Только в журнале выдачи ключей"
    answer: 1
    explanation: "Пункт 13.3 устанавливает, что такой допуск оформляется в экземпляре наряда, находящемся у производителя работ или наблюдающего."
    source: "Пункт 13.3"
