title: "Проверка по разделу XVIII"
moduleSlug: "18-vyveshivanie-zapreschayuschih-plakatov"
draft: false
questions:
  - type: single
    text: "Какой плакат вывешивается на приводах коммутационных аппаратов с ручным управлением, чтобы исключить подачу напряжения на рабочее место?"
    options:
      - "«Не включать! Работают люди»"
      - "«Заземлено»"
      - "«Стой! Напряжение»"
      - "«Работать здесь»"
    answer: 1
    explanation: "Пункт 18.1 требует вывешивать на приводах аппаратов с ручным управлением плакат «Не включать! Работают люди»."
    source: "Пункт 18.1"
  - type: single
    text: "Где вывешиваются плакаты у однополюсных разъединителей?"
    options:
      - "На приводе каждого полюса"
      - "Только на одном общем приводе"
      - "Только на двери помещения"
      - "Только на заземляющем ноже"
    answer: 1
    explanation: "Пункт 18.1 устанавливает, что у однополюсных разъединителей плакаты вывешиваются на приводе каждого полюса."
    source: "Пункт 18.1"
  - type: single
    text: "Где вывешиваются плакаты у разъединителей, управляемых оперативной штангой?"
    options:
      - "На ограждениях"
      - "На каске производителя работ"
      - "Только на кнопках дистанционного управления"
      - "Только в журнале учета работ"
    answer: 1
    explanation: "Пункт 18.1 требует вывешивать плакаты у разъединителей, управляемых оперативной штангой, на ограждениях."
    source: "Пункт 18.1"
  - type: single
    text: "Какой плакат вывешивается на задвижках, закрывающих доступ воздуха в пневматические приводы разъединителей?"
    options:
      - "«Не открывать! Работают люди»"
      - "«Не включать! Работа на линии»"
      - "«Заземлено»"
      - "«Влезать здесь»"
    answer: 1
    explanation: "Пункт 18.1 требует на таких задвижках вывешивать плакат «Не открывать! Работают люди»."
    source: "Пункт 18.1"
  - type: single
    text: "Где вывешивается плакат «Не включать! Работают люди» на присоединениях до 1000 В, не имеющих коммутационных аппаратов?"
    options:
      - "У снятых предохранителей"
      - "Только на входной двери здания"
      - "Только на полу рабочего места"
      - "Только в оперативном журнале"
    answer: 1
    explanation: "Пункт 18.1 указывает, что на таких присоединениях плакат вывешивается у снятых предохранителей."
    source: "Пункт 18.1"
  - type: single
    text: "Где еще должны быть вывешены запрещающие плакаты, связанные с дистанционным и местным управлением?"
    options:
      - "На ключах и кнопках дистанционного и местного управления, а также на автоматах или у места снятых предохранителей цепей управления и питания приводов"
      - "Только на дверях бытовых помещений"
      - "Только на личных удостоверениях работников"
      - "Только на переносном инструменте"
    answer: 1
    explanation: "Пункт 18.1 требует вывешивать плакаты на ключах, кнопках управления, автоматах или местах снятых предохранителей цепей управления и питания приводов."
    source: "Пункт 18.1"
  - type: single
    text: "Когда при дистанционном управлении с АРМ допускается вывешивать плакаты «Не включать! Работают люди»?"
    options:
      - "После заземления ЛЭП и оборудования"
      - "До любых отключений"
      - "Только после полного окончания работ"
      - "Только после снятия всех заземлений"
    answer: 1
    explanation: "Пункт 18.1 допускает вывешивание таких плакатов при управлении с АРМ после заземления ЛЭП и оборудования."
    source: "Пункт 18.1"
  - type: single
    text: "Как должны отображаться аналогичные плакаты при дистанционном управлении коммутационными аппаратами с АРМ оперативного персонала?"
    options:
      - "Рядом с графическим обозначением соответствующего коммутационного аппарата на схеме АРМ"
      - "Только в бумажной папке нарядов"
      - "Только на стенде в бытовом помещении"
      - "Они не отображаются в АРМ"
    answer: 1
    explanation: "Пункт 18.1 требует отображать аналогичные плакаты безопасности на схеме АРМ рядом с обозначением аппарата."
    source: "Пункт 18.1"
  - type: single
    text: "Какой плакат вывешивается на приводах разъединителей, которыми отключена для выполнения работ ВЛ, КВЛ или КЛ?"
    options:
      - "«Не включать! Работа на линии»"
      - "«Не открывать! Работают люди»"
      - "«Работать здесь»"
      - "«Заземлено»"
    answer: 1
    explanation: "Пункт 18.2 требует вывешивать на таких приводах один плакат «Не включать! Работа на линии»."
    source: "Пункт 18.2"
  - type: single
    text: "Сколько плакатов «Не включать! Работа на линии» вывешивается независимо от числа работающих бригад?"
    options:
      - "Один"
      - "По одному на каждого члена бригады"
      - "По одному на каждую смену"
      - "Не менее трех"
    answer: 1
    explanation: "Пункт 18.2 устанавливает, что вывешивается один плакат независимо от числа работающих бригад."
    source: "Пункт 18.2"
  - type: single
    text: "Когда при дистанционном управлении с АРМ допускается вывешивать плакат «Не включать! Работа на линии»?"
    options:
      - "После заземления ЛЭП"
      - "После полного окончания работ"
      - "До отключения линии"
      - "После снятия заземления"
    answer: 1
    explanation: "Пункт 18.2 допускает вывешивание этого плаката при дистанционном управлении с АРМ после заземления ЛЭП."
    source: "Пункт 18.2"
  - type: single
    text: "Где должен отображаться знак плаката «Не включать! Работа на линии!» при дистанционном управлении с АРМ?"
    options:
      - "В АРМ диспетчерского или оперативного персонала и в АРМ оперативного персонала объекта рядом с символом разъединителя, подающего напряжение на ЛЭП"
      - "Только на бумажной копии схемы"
      - "Только в журнале выдачи ключей"
      - "Только на переносном плакате у входа"
    answer: 1
    explanation: "Пункт 18.2 требует отображать знак в соответствующих АРМ рядом с символом разъединителя, которым подается напряжение на линию."
    source: "Пункт 18.2"
  - type: single
    text: "Где допускается вывешивать плакат «Не включать! Работа на линии!» при отсутствии разъединителей на ЛЭП до 1000 В?"
    options:
      - "На приводах или ключах управления коммутационным аппаратом в зависимости от его конструктивного исполнения"
      - "Только на ближайшей опоре без учета аппарата"
      - "Только на двери РУ"
      - "Только в журнале учета работ"
    answer: 1
    explanation: "Пункт 18.2 допускает вывешивать плакат на приводах или ключах управления коммутационным аппаратом при отсутствии разъединителей на линиях до 1000 В."
    source: "Пункт 18.2"
  - type: single
    text: "По чьей команде вывешивается и снимается плакат «Не включать! Работа на линии!»?"
    options:
      - "По команде диспетчерского или оперативного персонала, в чьем управлении находится ВЛ, КВЛ или КЛ"
      - "По команде любого члена бригады"
      - "По команде работника склада"
      - "Самостоятельно производителем работ без связи с оперативным персоналом"
    answer: 1
    explanation: "Пункт 18.2 устанавливает, что этот плакат вывешивается и снимается по команде диспетчерского или оперативного персонала, управляющего линией."
    source: "Пункт 18.2"
  - type: single
    text: "Что должен получить диспетчерский или оперативный персонал перед командой на снятие плаката «Не включать! Работа на линии!»?"
    options:
      - "Подтверждение об окончании работ и удалении всех бригад с рабочего места"
      - "Только сведения о погоде"
      - "Только подтверждение о выдаче инструмента"
      - "Только устное желание включить линию"
    answer: 1
    explanation: "Пункт 18.2 требует перед снятием плаката получить подтверждение об окончании работ и удалении всех бригад."
    source: "Пункт 18.2"
  - type: single
    text: "Какой плакат вывешивается при выполнении работ под напряжением на приводах ручного и ключах дистанционного управления коммутационных аппаратов?"
    options:
      - "«Работа под напряжением. Повторно не включать!»"
      - "«Не открывать! Работают люди»"
      - "«Работать здесь»"
      - "«Заземлено»"
    answer: 1
    explanation: "Пункт 18.3 требует при работах под напряжением вывешивать плакат «Работа под напряжением. Повторно не включать!»."
    source: "Пункт 18.3"
  - type: single
    text: "Когда не требуется вывешивать плакат «Работа под напряжением. Повторно не включать!» на приводах и ключах управления?"
    options:
      - "При работах под напряжением до 35 кВ методом на расстоянии изолирующими штангами или на частях до 1000 В в ТП и КТП методом в контакте"
      - "При любых работах под напряжением"
      - "При работах со снятием напряжения"
      - "При работах по наряду на КЛ"
    answer: 1
    explanation: "Пункт 18.3 устанавливает исключение для указанных работ методом на расстоянии и методом в контакте в ТП и КТП."
    source: "Пункт 18.3"
  - type: single
    text: "Где отображается знак плаката «Работа под напряжением. Повторно не включать!» при дистанционном управлении с АРМ?"
    options:
      - "В соответствующих АРМ рядом с символом выключателя, которым подается напряжение на линию электропередачи"
      - "Только рядом с символом заземляющего ножа"
      - "Только на бумажном наряде"
      - "В АРМ не отображается"
    answer: 1
    explanation: "Пункт 18.3 требует отображать знак в АРМ рядом с символом выключателя, подающего напряжение на ЛЭП."
    source: "Пункт 18.3"
  - type: single
    text: "Что должен получить диспетчерский или оперативный персонал перед командой на снятие плаката «Работа под напряжением. Повторно не включать!»?"
    options:
      - "Подтверждение об окончании работ и удалении всех бригад с рабочего места"
      - "Только подтверждение о начале работ"
      - "Только сведения о составе бригады"
      - "Только сообщение о наличии инструмента"
    answer: 1
    explanation: "Пункт 18.3 требует перед снятием этого плаката получить подтверждение об окончании работ и удалении всех бригад."
    source: "Пункт 18.3"
