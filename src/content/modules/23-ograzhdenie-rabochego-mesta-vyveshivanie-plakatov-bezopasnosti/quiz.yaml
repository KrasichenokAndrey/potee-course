title: "Проверка по разделу XXIII"
moduleSlug: "23-ograzhdenie-rabochego-mesta-vyveshivanie-plakatov-bezopasnosti"
draft: false
questions:
  - type: single
    text: 'Где должен быть вывешен плакат "Заземлено", если ошибочное включение коммутационного аппарата может подать напряжение на заземленный участок?'
    options:
      - "На приводе такого разъединителя, отделителя или выключателя нагрузки"
      - "Только на входной двери помещения"
      - "Только на временном ограждении рабочего места"
      - "На любом ближайшем шкафу управления без привязки к аппарату"
    answer: 1
    explanation: 'Пункт 23.1 требует вывешивать плакат "Заземлено" на приводах аппаратов, ошибочное включение которых может подать напряжение на заземленный участок.'
    source: "Пункт 23.1"
  - type: single
    text: 'Как обозначается заземленный участок при дистанционном управлении коммутационным аппаратом с АРМ оперативного персонала?'
    options:
      - 'Знак плаката "Заземлено" отображается рядом с графическим обозначением аппарата на схеме АРМ'
      - "На АРМ достаточно устного предупреждения оперативному персоналу"
      - "Знак выводится только в отдельный журнал сообщений"
      - "На схеме АРМ обозначение не требуется"
    answer: 1
    explanation: 'По пункту 23.1 при дистанционном управлении с АРМ знак плаката "Заземлено" должен отображаться рядом с обозначением соответствующего аппарата.'
    source: "Пункт 23.1"
  - type: single
    text: "Из какого материала должны быть изготовлены щиты, ширмы и экраны для временного ограждения токоведущих частей, оставшихся под напряжением?"
    options:
      - "Из изоляционных материалов"
      - "Из любого металла при наличии предупредительной надписи"
      - "Только из дерева без дополнительных требований"
      - "Из материалов, выбранных производителем работ по своему усмотрению"
    answer: 1
    explanation: "Пункт 23.2 прямо указывает, что для временного ограждения токоведущих частей применяются щиты, ширмы и экраны из изоляционных материалов."
    source: "Пункт 23.2"
  - type: single
    text: "Каким должно быть расстояние от временных ограждений до токоведущих частей при установке ограждений без снятия напряжения?"
    options:
      - "Не менее расстояния, указанного в таблице N 1"
      - "Не менее 0,1 м для всех электроустановок"
      - "Любым, если ограждение выполнено из изоляционного материала"
      - "Не менее длины вытянутой руки работника"
    answer: 1
    explanation: "Пункт 23.2 требует соблюдать расстояние не менее указанного в таблице N 1, когда ограждения устанавливаются без снятия напряжения."
    source: "Пункт 23.2"
  - type: single
    text: "До какого значения разрешается уменьшить расстояние от временного ограждения до токоведущих частей в электроустановках 6-10 кВ?"
    options:
      - "До 0,35 м"
      - "До 0,10 м"
      - "До 0,75 м"
      - "До 1,00 м"
    answer: 1
    explanation: "Пункт 23.2 допускает для электроустановок 6-10 кВ уменьшение этого расстояния до 0,35 м."
    source: "Пункт 23.2"
  - type: single
    text: "Что должно быть нанесено или укреплено на временных ограждениях?"
    options:
      - 'Надписи "Стой! Напряжение!" или соответствующие плакаты'
      - 'Только плакаты "Работать здесь"'
      - "Только номера бригады и наряда"
      - "Надписи с фамилией допускающего"
    answer: 1
    explanation: 'По пункту 23.2 на временные ограждения наносят надписи "Стой! Напряжение!" или укрепляют соответствующие плакаты.'
    source: "Пункт 23.2"
  - type: single
    text: 'Куда должны быть обращены плакаты "Стой! Напряжение" при выгораживании рабочего места щитами, ширмами, барьерами или шнуром?'
    options:
      - "Внутрь огражденного пространства"
      - "Наружу огражденного пространства во всех случаях"
      - "Только в сторону входа в помещение"
      - "В любую сторону, если плакат хорошо виден"
    answer: 1
    explanation: 'Пункт 23.2 требует вывешивать плакаты "Стой! Напряжение" обращенными внутрь огражденного пространства.'
    source: "Пункт 23.2"
  - type: single
    text: "В каких электроустановках разрешается применять изолирующие накладки, если нельзя оградить токоведущие части щитами?"
    options:
      - "В электроустановках напряжением до 20 кВ"
      - "Только в электроустановках до 1000 В"
      - "Во всех электроустановках без ограничения напряжения"
      - "Только на воздушных линиях"
    answer: 1
    explanation: "Пункт 23.3 разрешает применять изолирующие накладки в электроустановках напряжением до 20 кВ, когда токоведущие части нельзя оградить щитами."
    source: "Пункт 23.3"
  - type: single
    text: "Где размещают изолирующие накладки при невозможности оградить токоведущие части щитами?"
    options:
      - "Между отключенными и находящимися под напряжением токоведущими частями"
      - "Только на полу перед камерой"
      - "На дверях помещения электроустановки"
      - "На приводах коммутационных аппаратов"
