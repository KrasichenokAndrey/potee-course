    explanation: "Пункт 23.3 требует для электроустановок выше 1000 В двух работников с IV и III группой."
    source: "Пункт 23.3"
  - type: single
    text: "Какие средства защиты применяются при установке и снятии изолирующих накладок в электроустановках выше 1000 В?"
    options:
      - "Диэлектрические перчатки и изолирующие штанги либо клещи"
      - "Только защитные каски"
      - "Только указатель напряжения"
      - "Только переносное заземление"
    answer: 1
    explanation: "Пункт 23.3 требует применять диэлектрические перчатки и изолирующие штанги либо клещи."
    source: "Пункт 23.3"
  - type: single
    text: "Кто может устанавливать и снимать изолирующие накладки в электроустановках до 1000 В?"
