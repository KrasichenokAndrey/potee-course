    explanation: "Пункт 23.3 допускает установку и снятие накладок до 1000 В одним работником с группой не ниже III с применением диэлектрических перчаток."
    source: "Пункт 23.3"
  - type: single
    text: "Какие плакаты должны быть вывешены на ограждениях камер, шкафах и панелях, граничащих с рабочим местом?"
