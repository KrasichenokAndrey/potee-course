    explanation: "Пункт 23.3 указывает, что накладки помещаются между отключенными и находящимися под напряжением токоведущими частями."
    source: "Пункт 23.3"
  - type: single
    text: "Могут ли изолирующие накладки касаться токоведущих частей, находящихся под напряжением?"
    options:
      - "Да, могут"
      - "Нет, это запрещено во всех случаях"
      - "Только после полного снятия напряжения"
      - "Только при работе по распоряжению"
