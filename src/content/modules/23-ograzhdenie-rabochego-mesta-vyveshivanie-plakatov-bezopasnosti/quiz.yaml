    source: "Пункт 23.3"
  - type: single
    text: "Кто должен устанавливать и снимать изолирующие накладки на токоведущие части электроустановок выше 1000 В?"
    options:
      - "Два работника с IV и III группой по электробезопасности"
      - "Один работник с III группой"
      - "Любые два члена бригады без требований к группам"
      - "Только административно-технический персонал с V группой"
