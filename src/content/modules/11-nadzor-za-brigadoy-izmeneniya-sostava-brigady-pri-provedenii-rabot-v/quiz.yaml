title: "Проверка по разделу XI"
moduleSlug: "11-nadzor-za-brigadoy-izmeneniya-sostava-brigady-pri-provedenii-rabot-v"
draft: false
questions:
  - type: single
    text: "На кого после допуска к работе возлагается надзор за соблюдением бригадой требований безопасности?"
    options:
      - "На производителя работ, ответственного руководителя и наблюдающего"
      - "Только на любого члена бригады"
      - "Только на работника охраны"
      - "Только на руководителя организации, не находящегося на рабочем месте"
    answer: 1
    explanation: "Пункт 11.1 возлагает надзор после допуска на производителя работ, ответственного руководителя и наблюдающего."
    source: "Пункт 11.1"
  - type: single
    text: "Где по возможности должен находиться работник, осуществляющий надзор за бригадой?"
    options:
      - "На участке рабочего места, где выполняется наиболее опасная работа"
      - "В любом удобном помещении вне рабочего места"
      - "Только у входа на территорию организации"
      - "В месте хранения нарядов-допусков"
    answer: 1
    explanation: "Пункт 11.1 требует вести контроль за всеми членами бригады, находясь по возможности там, где выполняется наиболее опасная работа."
    source: "Пункт 11.1"
  - type: single
    text: "Может ли наблюдающий совмещать надзор с выполнением какой-либо работы?"
    options:
      - "Нет, такое совмещение не допускается"
      - "Да, если работа занимает мало времени"
      - "Да, если рядом находится производитель работ"
      - "Да, если работа выполняется без инструмента"
    answer: 1
    explanation: "Пункт 11.1 прямо запрещает наблюдающему совмещать надзор с выполнением какой-либо работы."
    source: "Пункт 11.1"
  - type: single
    text: "Что обязан сделать производитель работ или наблюдающий при временном уходе, если некому передать его обязанности?"
    options:
      - "Удалить бригаду с места работы"
      - "Оставить бригаду работать самостоятельно"
      - "Передать надзор любому члену бригады без оформления"
      - "Закончить работу без оформления перерыва"
    answer: 1
    explanation: "Пункт 11.2 требует удалить бригаду с места работы, если производитель или наблюдающий временно уходит и не может передать обязанности уполномоченному работнику."
    source: "Пункт 11.2"
  - type: single
    text: "Кому производитель работ или наблюдающий может передать свои обязанности на время временного ухода?"
    options:
      - "Ответственному руководителю работ, допускающему или работнику, имеющему право выдачи нарядов-допусков"
      - "Любому члену бригады с группой II"
      - "Работнику, не имеющему отношения к данной работе"
      - "Только водителю автомобиля"
    answer: 1
    explanation: "Пункт 11.2 допускает передачу обязанностей только ответственному руководителю, допускающему или работнику с правом выдачи нарядов-допусков."
    source: "Пункт 11.2"
  - type: single
    text: "Что должен передать производитель работ или наблюдающий заменившему его работнику на время своего отсутствия?"
    options:
      - "Наряд-допуск"
      - "Только ключи от бытового помещения"
      - "Только список инструментов"
      - "Только личное удостоверение"
    answer: 1
    explanation: "Пункт 11.2 требует на время временного отсутствия передать наряд-допуск заменившему работнику."
    source: "Пункт 11.2"
  - type: single
    text: "Разрешается ли в электроустановках выше 1000 В оставаться одному производителю работ, наблюдающему или членам бригады без производителя работ или наблюдающего?"
    options:
      - "Нет, не разрешается, кроме специально перечисленных работ"
      - "Да, всегда разрешается"
      - "Да, если работа выполняется днем"
      - "Да, если дверь РУ закрыта"
    answer: 1
    explanation: "Пункт 11.2 запрещает такое оставление в электроустановках выше 1000 В, за исключением отдельных видов работ."
    source: "Пункт 11.2"
  - type: single
    text: "Какая работа относится к исключениям, при которых допускается оставление работников в электроустановках выше 1000 В без производителя работ или наблюдающего?"
    options:
      - "Монтаж и проверка вторичных систем и устройств связи"
      - "Любая уборка территории"
      - "Работа на сборных шинах без наряда"
      - "Любая работа под напряжением"
    answer: 1
    explanation: "Пункт 11.2 среди исключений называет монтаж и проверку вторичных систем и устройств связи."
    source: "Пункт 11.2"
  - type: single
    text: "На каких условиях выполняются работы-исключения, при которых допускается отсутствие производителя работ или наблюдающего?"
    options:
      - "По наряду-допуску на основании и условиях пунктов 6.12 и 6.13 Правил"
      - "Без оформления работ"
      - "Только по устному распоряжению"
      - "Только по перечню текущей эксплуатации"
    answer: 1
    explanation: "Пункт 11.2 указывает, что перечисленные исключения выполняются по наряду-допуску с учетом пунктов 6.12 и 6.13."
    source: "Пункт 11.2"
  - type: single
    text: "Может ли один или несколько членов бригады временно уйти с рабочего места?"
    options:
      - "Да, с разрешения производителя работ или наблюдающего, без вывода из состава бригады"
      - "Да, без разрешения"
      - "Нет, временный уход всегда запрещен"
      - "Да, только с выдачей нового наряда"
    answer: 1
    explanation: "Пункт 11.3 допускает временный уход членов бригады с разрешения производителя работ или наблюдающего без вывода из состава бригады."
    source: "Пункт 11.3"
  - type: single
    text: "Сколько членов бригады должно оставаться на рабочем месте в электроустановках выше 1000 В при временном уходе части бригады?"
    options:
      - "Не менее двух, включая производителя работ или наблюдающего"
      - "Один любой работник"
      - "Только производитель работ без членов бригады"
      - "Не менее пяти работников"
    answer: 1
    explanation: "Пункт 11.3 требует, чтобы в электроустановках выше 1000 В на рабочем месте оставалось не менее двух работников, включая производителя работ или наблюдающего."
    source: "Пункт 11.3"
  - type: single
    text: "Как могут выходить из РУ и возвращаться на рабочее место члены бригады с группой III?"
    options:
      - "Самостоятельно"
      - "Только в сопровождении члена бригады с группой II"
      - "Только после выдачи нового наряда"
      - "Только с разрешения руководителя организации"
    answer: 1
    explanation: "Пункт 11.3 разрешает членам бригады с группой III самостоятельно выходить из РУ и возвращаться на рабочее место."
    source: "Пункт 11.3"
  - type: single
    text: "Как могут выходить из РУ и возвращаться на рабочее место члены бригады с группой II?"
    options:
      - "Только в сопровождении члена бригады с группой III или работника с правом единоличного осмотра"
      - "Самостоятельно без сопровождения"
      - "Только после закрытия наряда"
      - "Только вместе со всей бригадой"
    answer: 1
    explanation: "Пункт 11.3 разрешает членам бригады с группой II выходить и возвращаться только с сопровождающим группы III или работником с правом единоличного осмотра."
    source: "Пункт 11.3"
  - type: single
    text: "Что запрещено делать после выхода из РУ?"
    options:
      - "Оставлять дверь незапертой"
      - "Закрывать дверь на замок"
      - "Сообщать производителю работ о выходе"
      - "Возвращаться с разрешения производителя работ"
    answer: 1
    explanation: "Пункт 11.3 запрещает после выхода из РУ оставлять незапертой дверь."
    source: "Пункт 11.3"
  - type: single
    text: "Когда возвратившиеся члены бригады могут приступить к работе?"
    options:
      - "Только с разрешения производителя работ или наблюдающего"
      - "Сразу после возвращения без разрешения"
      - "Только после выдачи нового наряда"
      - "Только после распоряжения руководителя организации"
    answer: 1
    explanation: "Пункт 11.3 требует разрешения производителя работ или наблюдающего для возобновления работы вернувшимися членами бригады."
    source: "Пункт 11.3"
  - type: single
    text: "Что необходимо сделать при обнаружении нарушений Правил или обстоятельств, угрожающих безопасности работающих?"
    options:
      - "Удалить членов бригады с рабочего места и изъять наряд-допуск у производителя работ или наблюдающего"
      - "Продолжить работу до ближайшего перерыва"
      - "Только устно предупредить бригаду"
      - "Сделать запись после окончания работы"
    answer: 1
    explanation: "Пункт 11.4 требует удалить бригаду с рабочего места и изъять наряд-допуск при нарушениях или угрозе безопасности."
    source: "Пункт 11.4"
  - type: single
    text: "Когда бригада может быть снова допущена к работе после выявления нарушений?"
    options:
      - "Только после устранения нарушений с оформлением нового наряда-допуска"
      - "Сразу после устного замечания"
      - "Через один час независимо от устранения нарушений"
      - "После возвращения старого наряда без изменений"
    answer: 1
    explanation: "Пункт 11.4 разрешает повторный допуск только после устранения нарушений и оформления нового наряда-допуска."
    source: "Пункт 11.4"
  - type: single
    text: "Кто может изменять состав бригады после допуска к работе?"
    options:
      - "Работник, выдавший наряд-допуск, или другой работник с правом выдачи наряда-допуска в данной электроустановке"
      - "Любой член бригады"
      - "Только работник с группой II"
      - "Только водитель автомобиля"
    answer: 1
    explanation: "Пункт 11.5 разрешает изменять состав бригады выдающему наряд-допуск или другому работнику с правом выдачи наряда в данной электроустановке."
    source: "Пункт 11.5"
  - type: single
    text: "Как могут передаваться указания об изменении состава бригады?"
    options:
      - "По телефону, радио или с нарочным допускающему, ответственному руководителю или производителю работ"
      - "Только лично всем членам бригады"
      - "Только через журнал выдачи ключей"
      - "Только после полного окончания работ"
    answer: 1
    explanation: "Пункт 11.5 разрешает передавать указания об изменении состава бригады по телефону, радио или с нарочным указанным ответственным работникам."
    source: "Пункт 11.5"
  - type: single
    text: "Кто проводит целевой инструктаж работникам, введенным в состав бригады?"
    options:
      - "Производитель работ или наблюдающий"
      - "Только работник, выдавший ключи"
      - "Любой член бригады с группой II"
      - "Новый работник проходит без инструктажа"
    answer: 1
    explanation: "Пункт 11.5 обязывает производителя работ или наблюдающего провести целевые инструктажи введенным в состав бригады работникам."
    source: "Пункт 11.5"
  - type: single
    text: "В каких случаях наряд-допуск должен быть выдан заново?"
    options:
      - "При замене ответственного руководителя, производителя работ или наблюдающего, изменении состава бригады более чем наполовину или изменении условий работы"
      - "При временном уходе одного члена бригады с разрешения"
      - "При возвращении работника с группой III в РУ"
      - "При закрытии двери РУ на замок"
    answer: 1
    explanation: "Пункт 11.6 требует выдавать наряд заново при замене ключевых ответственных лиц, изменении состава бригады более чем наполовину или изменении условий работы."
    source: "Пункт 11.6"
