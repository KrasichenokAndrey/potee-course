title: "Проверка по разделу X"
moduleSlug: "10-ohrana-truda-pri-podgotovke-rabochego-mesta-i-pervichnom-dopuske-bri"
draft: false
questions:
  - type: single
    text: "Можно ли изменять мероприятия по подготовке рабочих мест, предусмотренные нарядом-допуском?"
    options:
      - "Нет, изменять предусмотренные нарядом-допуском мероприятия не допускается"
      - "Да, если производитель работ считает это удобным"
      - "Да, если работа выполняется быстрее"
      - "Да, без оформления, если изменения небольшие"
    answer: 1
    explanation: "Пункт 10.1 запрещает изменять мероприятия по подготовке рабочих мест, предусмотренные нарядом-допуском."
    source: "Пункт 10.1"
  - type: single
    text: "Что нужно сделать при сомнении в достаточности и правильности подготовки рабочего места или возможности безопасной работы?"
    options:
      - "Прекратить подготовку рабочих мест и отложить работу до выдачи нового наряда-допуска с необходимыми техническими мероприятиями"
      - "Продолжить работу, если бригада согласна"
      - "Внести исправления карандашом в старый наряд"
      - "Начать работу и уточнить меры позже"
    answer: 1
    explanation: "Пункт 10.1 требует прекратить подготовку и отложить работу до выдачи нового наряда-допуска, если возникли сомнения в безопасности."
    source: "Пункт 10.1"
  - type: single
    text: "С кем производитель работ должен выполнять подготовку рабочего места, если он совмещает обязанности допускающего?"
    options:
      - "С одним из членов бригады, имеющим группу III по электробезопасности"
      - "Один, без членов бригады"
      - "Только с работником группы I"
      - "С любым работником без требований к группе"
