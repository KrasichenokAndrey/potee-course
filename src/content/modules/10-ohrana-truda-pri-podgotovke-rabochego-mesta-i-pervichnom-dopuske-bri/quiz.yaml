    explanation: "Пункт 10.2 требует в таком случае выполнять подготовку рабочего места с одним из членов бригады, имеющим группу III, кроме специальных случаев пункта 42.5."
    source: "Пункт 10.2"
  - type: single
    text: "Как допускающий перед допуском убеждается в выполнении технических мероприятий по подготовке рабочего места?"
