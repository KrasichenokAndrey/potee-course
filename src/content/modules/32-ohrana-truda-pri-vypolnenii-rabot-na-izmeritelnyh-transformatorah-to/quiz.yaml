title: "Проверка по разделу XXXII"
moduleSlug: "32-ohrana-truda-pri-vypolnenii-rabot-na-izmeritelnyh-transformatorah-to"
draft: false
questions:
  - type: single
    text: "Можно ли использовать шины в цепи первичной обмотки трансформаторов тока как токоведущие при монтажных работах?"
    options:
      - "Нет, запрещается"
      - "Да, если работа кратковременная"
      - "Да, если вторичные цепи замкнуты"
      - "Да, при наличии наряда-допуска"
    answer: 1
    explanation: "Пункт 32.1 запрещает использовать шины в цепи первичной обмотки трансформаторов тока в качестве токоведущих при монтажных работах."
    source: "Пункт 32.1"
  - type: single
    text: "Можно ли использовать шины в цепи первичной обмотки трансформаторов тока как токоведущие при сварочных работах?"
    options:
      - "Да, если сварка выполняется оперативным персоналом"
      - "Нет, запрещается"
      - "Да, если ток не превышает расчетного"
      - "Да, если трансформатор тока отключен"
    answer: 2
    explanation: "Пункт 32.1 запрещает использовать эти шины как токоведущие и при сварочных работах."
    source: "Пункт 32.1"
  - type: single
    text: "Что должно быть сделано со вторичными обмотками трансформаторов тока до окончания монтажа вторичных цепей?"
    options:
      - "Они должны быть замкнуты накоротко"
      - "Они должны оставаться разомкнутыми"
      - "Они должны быть подключены к первичной цепи"
      - "Они должны быть сняты с трансформатора"
    answer: 1
    explanation: "Пункт 32.2 требует до окончания монтажа вторичных цепей замыкать вторичные обмотки трансформаторов тока накоротко."
    source: "Пункт 32.2"
  - type: single
    text: "До какого момента вторичные обмотки трансформаторов тока должны быть замкнуты накоротко при монтаже электроизмерительных приборов?"
    options:
      - "До окончания монтажа электроизмерительных приборов"
      - "Только до начала смены"
      - "Только до подачи заявки на работу"
      - "До первого осмотра оборудования"
    answer: 1
    explanation: "Пункт 32.2 требует держать вторичные обмотки замкнутыми накоротко до окончания монтажа электроизмерительных приборов."
    source: "Пункт 32.2"
  - type: single
    text: "Как должны быть подготовлены вторичные обмотки трансформаторов тока до окончания монтажа устройств релейной защиты и электроавтоматики?"
    options:
      - "Замкнуты накоротко"
      - "Отключены и оставлены разомкнутыми"
      - "Подключены к сварочному аппарату"
      - "Поданы под испытательное напряжение"
    answer: 1
    explanation: "Пункт 32.2 распространяет требование замыкания накоротко и на период монтажа устройств релейной защиты и электроавтоматики."
    source: "Пункт 32.2"
  - type: single
    text: "Когда должен быть присоединен прибор, указывающий полярность, при проверке полярности вторичных обмоток?"
    options:
      - "После подачи импульса в первичную обмотку"
      - "До подачи импульса в первичную обмотку"
      - "Только после снятия всех соединений"
      - "В любой момент проверки"
    answer: 2
    explanation: "Пункт 32.3 требует присоединить прибор к зажимам вторичной обмотки до подачи импульса в первичную обмотку."
    source: "Пункт 32.3"
  - type: single
    text: "Куда присоединяют прибор, указывающий полярность, при проверке вторичных обмоток трансформаторов тока?"
    options:
      - "К зажимам вторичной обмотки"
      - "К шинам первичной обмотки как сварочной цепи"
      - "К корпусу трансформатора"
      - "К заземляющему устройству вместо вторичной цепи"
    answer: 1
    explanation: "Пункт 32.3 указывает, что прибор должен быть присоединен к зажимам вторичной обмотки."
    source: "Пункт 32.3"
  - type: single
    text: "Какой порядок действий является правильным при проверке полярности вторичных обмоток трансформатора тока?"
    options:
      - "Сначала присоединить прибор к зажимам вторичной обмотки, затем подать импульс в первичную обмотку"
      - "Сначала подать импульс, затем искать место подключения прибора"
      - "Использовать шины первичной обмотки для сварки, затем проверить полярность"
      - "Оставить вторичные обмотки разомкнутыми до конца проверки"
    answer: 1
    explanation: "Пункт 32.3 фиксирует именно такую последовательность: прибор подключают до подачи импульса в первичную обмотку."
    source: "Пункт 32.3"
