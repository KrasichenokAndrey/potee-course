title: "Проверка по разделу XXII"
moduleSlug: "22-ohrana-truda-pri-ustanovke-zazemleniy-na-vl"
draft: false
questions:
  - type: single
    text: "Где должны быть заземлены ВЛ напряжением выше 1000 В, отключенные для работ?"
    options:
      - "Во всех РУ и у секционирующих коммутационных аппаратов, где отключена линия"
      - "Только на рабочем месте"
      - "Только на ближайшей опоре без учета РУ"
      - "Только на конце линии"
    answer: 1
    explanation: "Пункт 22.1 требует заземлять ВЛ выше 1000 В во всех РУ и у секционирующих коммутационных аппаратов, где линия отключена."
    source: "Пункт 22.1"
  - type: single
    text: "Когда ВЛ 35 кВ и выше с ответвлениями разрешается не заземлять на подстанциях, подключенных к этим ответвлениям?"
    options:
      - "Если ВЛ заземлена с двух сторон, а на этих подстанциях заземления установлены за отключенными линейными разъединителями"
      - "Если на линии работает только одна бригада"
      - "Если работа длится меньше часа"
      - "Если подстанция не имеет местного оперативного персонала"
    answer: 1
    explanation: "Пункт 22.1 допускает это исключение при заземлении ВЛ с двух сторон и установке заземлений за отключенными линейными разъединителями на подстанциях ответвлений."
    source: "Пункт 22.1"
  - type: single
    text: "Где допускается заземлять ВЛ напряжением 6-20 кВ по пункту 22.1?"
    options:
      - "Только в одном РУ, у одного секционирующего аппарата или на ближайшей к ним опоре при выполнении дополнительных условий"
      - "Только во всех РУ без исключений"
      - "Только на рабочем месте независимо от условий"
      - "Заземление ВЛ 6-20 кВ не требуется"
    answer: 1
    explanation: "Пункт 22.1 разрешает для ВЛ 6-20 кВ ограничиться одним РУ, одним секционирующим аппаратом или ближайшей опорой, если на ВЛ установлены заземления между рабочим местом и остальными РУ или аппаратами."
    source: "Пункт 22.1"
  - type: single
    text: "На каких опорах следует устанавливать заземления на ВЛ 6-20 кВ в условиях, когда ее не заземляют во всех РУ?"
    options:
      - "На опорах, имеющих заземляющие устройства"
      - "На любых опорах без учета заземляющих устройств"
      - "Только на деревянных опорах без спусков"
      - "Только на конечных анкерных опорах"
    answer: 1
    explanation: "Пункт 22.1 требует устанавливать такие заземления на опорах, имеющих заземляющие устройства."
    source: "Пункт 22.1"
  - type: single
    text: "Где достаточно установить заземление на ВЛ напряжением до 1000 В?"
    options:
      - "Только на рабочем месте"
      - "Во всех РУ и у всех секционирующих аппаратов"
      - "Только на ближайшей подстанции"
      - "Только на конечной опоре"
    answer: 1
    explanation: "Пункт 22.1 устанавливает, что на ВЛ до 1000 В достаточно заземления только на рабочем месте."
    source: "Пункт 22.1"
  - type: single
    text: "Что должно быть заземлено на рабочем месте каждой бригады дополнительно к заземлениям по пункту 22.1?"
    options:
      - "Провода всех фаз, а при необходимости и грозозащитные тросы"
      - "Только одна фаза"
      - "Только опора"
      - "Только инструмент бригады"
    answer: 1
    explanation: "Пункт 22.2 требует на рабочем месте каждой бригады заземлить провода всех фаз, а при необходимости грозозащитные тросы."
    source: "Пункт 22.2"
  - type: single
    text: "Где должны быть заземлены провода или тросы при монтаже проводов в анкерном пролете?"
    options:
      - "На начальной анкерной опоре и на одной из конечных промежуточных опор перед анкерной опорой конечной"
      - "Только на конечной анкерной опоре"
      - "Только в середине пролета"
      - "Заземление при монтаже не требуется"
    answer: 1
    explanation: "Пункт 22.3 требует заземлять провода или тросы на начальной анкерной опоре и на одной из конечных промежуточных опор."
    source: "Пункт 22.3"
  - type: single
    text: "Почему не разрешается заземлять провода или тросы на конечной анкерной опоре смонтированного анкерного пролета?"
    options:
      - "Чтобы исключить переход потенциала от грозовых разрядов и других перенапряжений с готового участка на следующий монтируемый участок"
      - "Потому что конечные анкерные опоры всегда деревянные"
      - "Потому что на них нельзя находиться работникам"
      - "Потому что заземления на ВЛ запрещены"
    answer: 1
    explanation: "Пункт 22.4 запрещает такое заземление для предотвращения перехода потенциала на следующий монтируемый участок ВЛ."
    source: "Пункт 22.4"
  - type: single
    text: "Как заземляют фазу на ВЛ с расщепленными проводами?"
    options:
      - "Разрешается заземлять один провод фазы, но при наличии изолирующих распорок требуется заземлять все провода фазы"
      - "Всегда заземляют только один провод независимо от распорок"
      - "Заземление расщепленных проводов запрещено"
      - "Заземляют только грозозащитный трос"
    answer: 1
    explanation: "Пункт 22.5 разрешает заземлять один провод в фазе, но при изолирующих распорках требует заземления всех проводов фазы."
    source: "Пункт 22.5"
  - type: single
    text: "Где нужно устанавливать заземление на рабочем месте на одноцепных ВЛ?"
    options:
      - "На опоре, где ведется работа, или на соседней"
      - "Только в РУ"
      - "Только на конечной анкерной опоре"
      - "Только в середине линии"
    answer: 1
    explanation: "Пункт 22.6 требует устанавливать заземление на одноцепных ВЛ на рабочей или соседней опоре."
    source: "Пункт 22.6"
  - type: single
    text: "При каком условии разрешается установить заземления с двух сторон участка ВЛ, на котором работает бригада?"
    options:
      - "Если расстояние между заземлениями не превышает 2 км"
      - "Если расстояние между заземлениями больше 5 км"
      - "Если заземления устанавливаются только на одной фазе"
      - "Если заземления не присоединены к заземляющему устройству"
