    answer: 1
    explanation: "Пункт 22.7 требует предварительно заземлить трос перед отсоединением или присоединением заземляющего спуска."
    source: "Пункт 22.7"
  - type: single
    text: "Что нужно сделать с молниезащитным тросом, если на нем предусмотрена плавка гололеда?"
