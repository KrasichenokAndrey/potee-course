      - "Только на рабочем инструменте"
      - "Только на конечной анкерной опоре"
    answer: 1
    explanation: "Пункт 22.7 устанавливает место заземления: в сторону изолированного пролета или в пролете на месте проведения работ."
    source: "Пункт 22.7"
  - type: single
    text: "Когда можно отсоединять и присоединять заземляющий спуск к грозозащитному тросу, изолированному от земли?"
    options:
