    explanation: "Пункт 22.6 разрешает установку заземлений с двух сторон участка при расстоянии между ними не более 2 км."
    source: "Пункт 22.6"
  - type: single
    text: "Когда изолированный от опоры молниезащитный трос должен быть заземлен?"
    options:
      - "При работе на нем или на конструкции опоры, если требуется приблизиться к тросу менее чем на 1 м"
      - "Только после полного окончания работ"
      - "Только при отсутствии наряда-допуска"
      - "Никогда, если трос изолирован"
    answer: 1
    explanation: "Пункт 22.7 требует заземлять такой трос при работе на нем или при приближении к нему менее чем на 1 м."
    source: "Пункт 22.7"
  - type: single
    text: "Где нужно устанавливать заземление на изолированном от опоры молниезащитном тросе?"
    options:
